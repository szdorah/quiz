name: Keep free services active

on:
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch Supabase database directly
        run: |
          curl -sS --fail --retry 3 --retry-delay 10 --max-time 60 \
            -X POST https://orvpplbnppjhbflrxpfm.supabase.co/rest/v1/rpc/api_keepalive \
            -H 'apikey: sb_publishable_ryu9Q_yvmPZkmaoPxCFrYw_YwJWa9qV' \
            -H 'Content-Type: application/json' \
            -d '{}'

      - name: Wake Render app
        run: |
          curl -L --fail --retry 3 --retry-delay 10 --max-time 180 \
            https://szagri-quiz.onrender.com/health
