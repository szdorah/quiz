<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Oktatói felület – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card form-card">
      <div class="topbar">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <span class="badge">Oktató</span>
      </div>
      <h1 style="font-size:2.6rem;margin-top:34px">Oktatói felület</h1>
      <p>Ez az első projektváz. A következő lépésben ide kerül a valódi belépés, a Kvízeim, az Új kvíz és az Eredmények felület.</p>
      <div class="grid" style="margin-top:24px">
        <div class="stat"><strong>Kvízeim</strong><span class="small">Mentett kvízek és indítás</span></div>
        <div class="stat"><strong>Új kvíz</strong><span class="small">Kérdések szerkesztése</span></div>
        <div class="stat"><strong>Eredmények</strong><span class="small">CSV / Excel export</span></div>
      </div>
      <div class="actions">
        <a class="btn" href="/">Vissza a kezdőlapra</a>
      </div>
    </section>
  </main>
</body>
</html>
