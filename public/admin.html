<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Oktatói belépés – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card form-card">
      <div class="topbar">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <span class="badge">Oktató</span>
      </div>
      <h1 class="page-title">Oktatói belépés</h1>
      <p>Lépj be a kvízek létrehozásához, indításához és az eredmények megtekintéséhez.</p>
      <form id="loginForm">
        <label for="password">Jelszó</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Oktatói jelszó" required />
        <div class="actions">
          <button class="btn primary" type="submit">Belépés</button>
          <a class="btn" href="/">Vissza</a>
        </div>
        <p id="status" class="small"></p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      status.textContent = 'Belépés…';
      const res = await fetch('/api/admin/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({password: document.getElementById('password').value})
      });
      const data = await res.json();
      if (!res.ok) { status.textContent = data.error || 'Sikertelen belépés.'; return; }
      location.href = '/admin/dashboard';
    });
  </script>
</body>
</html>
