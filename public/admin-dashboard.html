<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oktatói felület – SZAGRI Quiz</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><section class="card dashboard-card">
<div class="topbar"><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><button id="logout" class="btn compact">Kilépés</button></div>
<div class="dashboard-head"><div><span class="badge">Oktatói felület</span><h1 class="page-title">Kvízeim</h1><p>Kvízek kezelése, élő játékok és korábbi eredmények.</p></div><a class="btn primary" href="/admin/quiz/new">+ Új kvíz</a></div>
<div class="teacher-tabs"><button class="tab-btn active" data-tab="quizzes">Kvízek</button><button class="tab-btn" data-tab="results">Eredményarchívum</button></div>
<div id="quizzesTab"><div id="quizList"></div></div><div id="resultsTab" class="hidden"><div id="resultList"></div></div><p id="status" class="small"></p>
</section></main>
<div id="gameModal" class="modal-backdrop hidden"><div class="modal-card"><span id="gameBadge" class="badge">Váróterem</span><h2 id="modalTitle"></h2><div id="lobbyView"><div class="lobby-layout"><div><div id="gameCode" class="big-code"></div><p>Csatlakozás kóddal vagy QR-kóddal.</p><div id="joinUrl" class="join-link-box"></div></div><img id="qrCode" class="qr-code"></div><div id="playerCount" class="waiting-pill"><span class="pulse"></span> 0 hallgató</div><div id="playerList" class="player-chips"></div></div><div id="runningView" class="hidden"><div class="stat"><strong id="activeQuestion">Kérdés folyamatban</strong><span id="answerProgress" class="small">0 válasz</span></div><div id="distribution" class="distribution-box"></div></div><div id="leaderboardView" class="hidden"><h3>Végeredmény</h3><div id="leaderboard"></div></div><div class="actions"><button id="beginGame" class="btn primary">▶ Kvíz indítása</button><button id="nextQuestion" class="btn primary hidden">Következő kérdés →</button><button id="copyLink" class="btn">Link másolása</button><button id="closeModal" class="btn">Bezárás</button></div><p id="modalStatus" class="small"></p></div></div>
<div id="resultModal" class="modal-backdrop hidden"><div class="modal-card"><span class="badge">Mentett eredmény</span><h2 id="resultTitle"></h2><div id="resultDetails"></div><div class="actions"><a id="xlsxLink" class="btn primary">XLSX letöltése</a><button id="closeResult" class="btn">Bezárás</button></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=s=>document.querySelector(s),status=$('#status'),socket=io();let sessionId='',joinUrl='',questionNo=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadQuizzes(){status.textContent='Betöltés…';const r=await fetch('/api/quizzes'),d=await r.json();status.textContent='';if(!r.ok)return status.textContent=d.error;const list=d.quizzes||[];$('#quizList').innerHTML=list.length?`<div class="quiz-list">${list.map(q=>`<article class="quiz-row quiz-row-actions"><div><strong>${esc(q.title)}</strong><span class="small">${q.question_count} kérdés${q.description?' · '+esc(q.description):''}</span></div><div class="row-actions"><button class="btn primary compact start" data-id="${q.id}" data-title="${esc(q.title)}">Játék</button><a class="btn compact" href="/admin/quiz/edit?id=${q.id}">Szerkesztés</a><button class="btn compact duplicate" data-id="${q.id}">Másolás</button><button class="btn compact danger delete" data-id="${q.id}" data-title="${esc(q.title)}">Törlés</button></div></article>`).join('')}</div>`:'<div class="empty-state"><div class="empty-icon">✦</div><strong>Még nincs kvíz</strong></div>';document.querySelectorAll('.start').forEach(b=>b.onclick=()=>startGame(b));document.querySelectorAll('.duplicate').forEach(b=>b.onclick=()=>duplicateQuiz(b));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteQuiz(b));}
async function duplicateQuiz(b){b.disabled=true;const r=await fetch(`/api/quizzes/${b.dataset.id}/duplicate`,{method:'POST'}),d=await r.json();b.disabled=false;if(!r.ok)return alert(d.error||'Hiba');await loadQuizzes();}
async function deleteQuiz(b){if(!confirm(`Biztosan törlöd ezt a kvízt?\n\n${b.dataset.title}\n\nA korábban archivált eredmények megmaradnak.`))return;const r=await fetch(`/api/quizzes/${b.dataset.id}`,{method:'DELETE'}),d=await r.json();if(!r.ok)return alert(d.error||'Hiba');await loadQuizzes();}
async function loadResults(){const r=await fetch('/api/results'),d=await r.json();if(!r.ok)return $('#resultList').innerHTML=`<p>${esc(d.error)}</p>`;const a=d.results||[];$('#resultList').innerHTML=a.length?`<div class="quiz-list">${a.map(x=>`<article class="quiz-row"><div><strong>${esc(x.quiz_title)}</strong><span class="small">${fmt(x.ended_at||x.started_at)} · ${x.player_count} fő · kód: ${esc(x.game_code||'')}</span></div><div class="row-actions"><button class="btn compact view-result" data-id="${x.game_id}">Megnyitás</button><a class="btn compact primary" href="/api/results/${x.game_id}/xlsx">XLSX</a></div></article>`).join('')}</div>`:'<div class="empty-state"><strong>Még nincs lezárt, archivált játék.</strong></div>';document.querySelectorAll('.view-result').forEach(b=>b.onclick=()=>openResult(b.dataset.id));}
const fmt=v=>v?new Date(v).toLocaleString('hu-HU'):'–';
async function openResult(id){const r=await fetch(`/api/results/${id}`),d=await r.json();if(!r.ok)return alert(d.error);const a=d.result,p=a.players||[];$('#resultTitle').textContent=a.quizTitle||'Eredmény';$('#xlsxLink').href=`/api/results/${id}/xlsx`;$('#resultDetails').innerHTML=`<div class="result-summary"><span><strong>${p.length}</strong><small>résztvevő</small></span><span><strong>${fmt(a.endedAt)}</strong><small>befejezés</small></span></div><div class="quiz-list">${p.map((x,i)=>`<article class="quiz-row"><strong>${i+1}. ${esc(x.emoji)} ${esc(x.name)}</strong><strong>${x.score} pont</strong></article>`).join('')}</div>`;$('#resultModal').classList.remove('hidden');}
async function startGame(b){b.disabled=true;const r=await fetch(`/api/quizzes/${b.dataset.id}/start`,{method:'POST'}),d=await r.json();b.disabled=false;if(!r.ok)return alert(d.error);sessionId=d.session.id;joinUrl=d.joinUrl;questionNo=0;$('#modalTitle').textContent=b.dataset.title;$('#gameCode').textContent=d.session.game_code;$('#joinUrl').textContent=d.joinUrl;$('#qrCode').src=d.qrDataUrl;$('#playerList').innerHTML='';$('#playerCount').innerHTML='<span class="pulse"></span> 0 hallgató';$('#lobbyView').classList.remove('hidden');$('#runningView').classList.add('hidden');$('#leaderboardView').classList.add('hidden');$('#beginGame').classList.remove('hidden');$('#nextQuestion').classList.add('hidden');$('#copyLink').classList.remove('hidden');$('#gameBadge').textContent='Váróterem';$('#gameModal').classList.remove('hidden');socket.emit('session:watch',sessionId);}
socket.on('players:update',p=>{$('#playerCount').innerHTML=`<span class="pulse"></span> ${p.length} hallgató`;$('#playerList').innerHTML=p.map(x=>`<span class="player-chip">${esc(x.emoji)} ${esc(x.name)}</span>`).join('');});socket.on('answers:progress',x=>$('#answerProgress').textContent=`${x.answeredCount} / ${x.playerCount} válasz`);socket.on('answers:distribution',renderDistribution);
function renderDistribution(d){const box=$('#distribution');if(!d||!Array.isArray(d.counts)){box.innerHTML='';return;}const max=Math.max(1,...d.counts);box.innerHTML=`<h4>Élő válaszmegoszlás</h4>${d.counts.map((n,i)=>`<div class="dist-row"><span>${String.fromCharCode(65+i)}</span><div><i style="width:${n/max*100}%"></i></div><strong>${n}</strong></div>`).join('')}`;}
$('#beginGame').onclick=async()=>{const r=await fetch(`/api/games/${sessionId}/begin`,{method:'POST'}),d=await r.json();if(!r.ok)return $('#modalStatus').textContent=d.error;questionNo=1;$('#lobbyView').classList.add('hidden');$('#runningView').classList.remove('hidden');$('#beginGame').classList.add('hidden');$('#nextQuestion').classList.remove('hidden');$('#activeQuestion').textContent='1. kérdés folyamatban';$('#answerProgress').textContent='0 válasz';$('#distribution').innerHTML='';$('#gameBadge').textContent='Élő játék';};
$('#nextQuestion').onclick=async()=>{const r=await fetch(`/api/games/${sessionId}/next`,{method:'POST'}),d=await r.json();if(!r.ok)return $('#modalStatus').textContent=d.error;if(d.status==='finished'){showBoard(d.leaderboard||[]);loadResults();return;}questionNo=Number(d.question?.questionNumber||questionNo+1);$('#activeQuestion').textContent=`${questionNo}. kérdés folyamatban`;$('#answerProgress').textContent='0 válasz';$('#distribution').innerHTML='';};
function showBoard(b){$('#runningView').classList.add('hidden');$('#leaderboardView').classList.remove('hidden');$('#nextQuestion').classList.add('hidden');$('#copyLink').classList.add('hidden');$('#gameBadge').textContent='Kvíz vége';$('#leaderboard').innerHTML=b.map((x,i)=>`<article class="quiz-row"><strong>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(x.emoji)} ${esc(x.name)}</strong><strong>${x.score} pont</strong></article>`).join('');}
$('#copyLink').onclick=()=>navigator.clipboard.writeText(joinUrl);$('#closeModal').onclick=()=>$('#gameModal').classList.add('hidden');$('#closeResult').onclick=()=>$('#resultModal').classList.add('hidden');$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin';};
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x===b));$('#quizzesTab').classList.toggle('hidden',b.dataset.tab!=='quizzes');$('#resultsTab').classList.toggle('hidden',b.dataset.tab!=='results');if(b.dataset.tab==='results')loadResults();});
loadQuizzes();
</script></body></html>
