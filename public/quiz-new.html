<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Új kvíz – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card form-card wide-form">
      <div class="topbar">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <span class="badge">Új kvíz</span>
      </div>
      <h1 class="page-title">Új kvíz</h1>
      <p>Ez már a szerkesztő első működő váza. A következő lépésben ide kerülnek a kérdések és a mentés.</p>

      <label for="title">Kvíz címe</label>
      <input id="title" placeholder="pl. Magasépítéstan 2 – 1. előadás" />

      <label for="description">Rövid leírás</label>
      <input id="description" placeholder="Opcionális leírás" />

      <div class="editor-placeholder">
        <strong>Kérdések</strong>
        <span class="small">A következő fejlesztési lépésben itt lehet majd kérdéseket hozzáadni.</span>
      </div>

      <div class="actions">
        <button class="btn primary" type="button" disabled>Mentés – következő lépés</button>
        <a class="btn" href="/admin/dashboard">Vissza a kvízekhez</a>
      </div>
    </section>
  </main>
</body>
</html>
