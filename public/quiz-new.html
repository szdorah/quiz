<!doctype html>
<html lang="hu">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvízszerkesztő – SZAGRI Quiz</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<main class="shell editor-shell"><section class="card quiz-builder-card">
  <div class="topbar"><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><span class="badge">Kvízszerkesztő</span></div>
  <div class="builder-intro"><div><h1 id="pageTitle" class="page-title">Új kvíz</h1><p>Szerkeszd a kérdéseket, húzd őket sorrendbe, vagy készíts polygonos képkérdést.</p></div><div class="builder-actions-top"><button id="importBtn" class="btn" type="button">Import JSON</button><button id="exportBtn" class="btn" type="button">Export JSON</button><a class="btn" href="/admin/dashboard">Mégse</a><button id="saveTop" class="btn primary" type="button">Mentés</button></div></div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <div class="quiz-meta-grid"><div><label>Kvíz címe</label><input id="title" maxlength="120"></div><div><label>Rövid leírás</label><input id="description" maxlength="240"></div></div>
  <div class="section-head builder-section-head"><div><strong>Kérdések</strong><span class="small">A ☰ jellel a teljes kérdés is átrendezhető.</span></div><button id="addQuestion" class="btn compact" type="button">+ Új kérdés</button></div>
  <div id="questions" class="question-sort-list"></div>
  <div class="actions builder-footer"><button id="saveBottom" class="btn primary">Mentés</button><a class="btn" href="/admin/dashboard">Vissza</a></div><p id="status" class="small"></p>
</section></main>
<script>
const $=s=>document.querySelector(s), questionsEl=$('#questions');
const editId=new URLSearchParams(location.search).get('id'); let counter=0;
const types={SINGLE_SELECT:'Egy helyes válasz',MULTI_SELECT:'Több helyes válasz',TRUE_FALSE:'Igaz / hamis',ORDERING:'Sorrendbe rendezés',CATEGORIZATION:'Kategóriákba rendezés',IMAGE_CLICK:'Képre kattintás – polygon'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaultQuestion(){return{questionType:'SINGLE_SELECT',questionText:'',imageUrl:null,timeLimitSeconds:30,points:1000,explanation:'',options:[{text:'',isCorrect:true},{text:'',isCorrect:false},{text:'',isCorrect:false},{text:'',isCorrect:false}],config:{}};}

function createQuestion(data=defaultQuestion()){
 const i=counter++, el=document.createElement('section'); el.className='question-editor question-editor-large question-sortable'; el.dataset.index=i; el._data=structuredClone(data); if(!el._data.config)el._data.config={};
 el.innerHTML=`<div class="question-editor-head"><div><span class="drag-handle question-drag" title="Kérdés mozgatása">☰</span><strong class="question-number"></strong><span class="question-type-label small"></span></div><div class="question-head-actions"><button class="btn compact duplicate-question">Másolás</button><button class="btn compact danger remove-question">Törlés</button></div></div>
 <div class="question-editor-grid"><div class="question-main-column"><label>Kérdés szövege</label><textarea class="question-text question-text-large" rows="3"></textarea><label>Válaszmagyarázat <span class="small">(válasz után jelenik meg)</span></label><textarea class="explanation" rows="2" placeholder="Opcionális magyarázat…"></textarea><div class="image-host"></div></div>
 <aside class="question-settings-panel"><label>Kérdéstípus</label><select class="question-type">${Object.entries(types).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><label>Időkeret</label><select class="time-limit">${[15,20,30,45,60,90,120].map(v=>`<option value="${v}">${v} mp</option>`).join('')}</select><label>Pont</label><input class="points" type="number" min="0" max="5000"></aside></div><div class="answers-block"><div class="answers-block-head"><strong class="answer-title">Válaszok</strong><span class="answer-help small"></span></div><div class="editor-body"></div></div>`;
 el.querySelector('.question-text').value=data.questionText||data.prompt||''; el.querySelector('.explanation').value=data.explanation||data.settings?.explanation||''; el.querySelector('.question-type').value=data.questionType||'SINGLE_SELECT'; el.querySelector('.time-limit').value=String(data.timeLimitSeconds||data.settings?.timeLimitSeconds||30); el.querySelector('.points').value=data.points||data.settings?.points||1000;
 el.querySelector('.question-type').onchange=e=>{collectOne(el);el._data.questionType=e.target.value;normalizeTypeData(el._data);renderBody(el);};
 el.querySelector('.duplicate-question').onclick=()=>{collectOne(el);const copy=structuredClone(el._data);const n=createQuestion(copy);el.after(n);renumber();};
 el.querySelector('.remove-question').onclick=()=>{if(questionsEl.children.length<=1)return;el.remove();renumber();};
 questionsEl.appendChild(el); renderBody(el); renumber(); return el;
}
function normalizeTypeData(d){const t=d.questionType;if(t==='TRUE_FALSE')d.options=[{text:'Igaz',isCorrect:true},{text:'Hamis',isCorrect:false}];else if(t==='ORDERING'&&(!d.options||d.options.length<2))d.options=[{text:''},{text:''},{text:''},{text:''}];else if(t==='CATEGORIZATION'){d.config.categories=d.config.categories?.length>=2?d.config.categories:['1. kategória','2. kategória','3. kategória'];d.options=d.options?.length?d.options:[{text:''},{text:''},{text:''},{text:''}];d.config.assignments=Array.isArray(d.config.assignments)?d.config.assignments:Array(d.options.length).fill(0);}else if(t==='IMAGE_CLICK'){d.options=[];d.config.polygon=Array.isArray(d.config.polygon)?d.config.polygon:[];}else if(!d.options?.length)d.options=[{text:'',isCorrect:true},{text:'',isCorrect:false},{text:'',isCorrect:false},{text:'',isCorrect:false}];}
function renderBody(el){const d=el._data;normalizeTypeData(d);el.querySelector('.question-type-label').textContent=types[d.questionType];const body=el.querySelector('.editor-body'); body.innerHTML='';
 if(['SINGLE_SELECT','MULTI_SELECT','TRUE_FALSE'].includes(d.questionType))renderChoices(el,body);
 else if(d.questionType==='ORDERING')renderOrdering(el,body);
 else if(d.questionType==='CATEGORIZATION')renderCategorization(el,body);
 else renderPolygon(el,body);
 renderImage(el);}
function renderChoices(el,body){const d=el._data,multi=d.questionType==='MULTI_SELECT',tf=d.questionType==='TRUE_FALSE';el.querySelector('.answer-help').textContent=multi?'Több helyes is lehet; részpont jár.':'Jelöld a helyes választ.';d.options.forEach((o,i)=>{const r=document.createElement('div');r.className='answer-editor';r.innerHTML=`<input class="correct-marker" type="${multi?'checkbox':'radio'}" name="c${el.dataset.index}" ${o.isCorrect?'checked':''}><span class="answer-letter">${tf?(i?'×':'✓'):String.fromCharCode(65+i)}</span><input class="answer-text" maxlength="240" ${tf?'readonly':''}>`;r.querySelector('.answer-text').value=o.text||'';body.appendChild(r);});}
function renderOrdering(el,body){const d=el._data;el.querySelector('.answer-help').innerHTML='A helyes sorrend itt látható. Maximum 10 elem.';const list=document.createElement('div');list.className='ordering-editor-list';d.options.forEach((o,i)=>list.appendChild(orderRow(el,o,i)));body.appendChild(list);const add=document.createElement('button');add.className='btn compact';add.textContent='+ Elem';add.onclick=()=>{collectOne(el);if(el._data.options.length>=10)return;el._data.options.push({text:''});renderBody(el);};body.appendChild(add);bindItemSort(list,()=>updateOrderNumbers(list));updateOrderNumbers(list);}
function orderRow(el,o,i){const r=document.createElement('div');r.className='ordering-item sortable-item';r.innerHTML=`<span class="drag-handle">☰</span><span class="ordering-position"></span><input class="answer-text" maxlength="240"><div class="order-controls"><button class="mini-btn up">↑</button><button class="mini-btn down">↓</button><button class="mini-btn remove">×</button></div>`;r.querySelector('.answer-text').value=o.text||'';r.querySelector('.up').onclick=()=>moveRow(r,-1);r.querySelector('.down').onclick=()=>moveRow(r,1);r.querySelector('.remove').onclick=()=>{if(r.parentElement.children.length<=2)return;r.remove();updateOrderNumbers(r.parentElement);};return r;}
function moveRow(r,d){const a=[...r.parentElement.children],i=a.indexOf(r),j=i+d;if(j<0||j>=a.length)return;if(d<0)r.parentElement.insertBefore(r,a[j]);else r.parentElement.insertBefore(a[j],r);updateOrderNumbers(r.parentElement);}
function updateOrderNumbers(l){[...l.children].forEach((x,i)=>x.querySelector('.ordering-position').textContent=i+1);}
function renderCategorization(el,body){const d=el._data;el.querySelector('.answer-help').textContent='Az elemeket a megadott kategóriákhoz rendeld.';const c=document.createElement('div');c.className='category-editor';c.innerHTML=`<div><strong>Kategóriák</strong><div class="cat-names"></div><button class="btn compact add-cat">+ Kategória</button></div><div><strong>Elemek</strong><div class="cat-items"></div><button class="btn compact add-item">+ Elem</button></div>`;body.appendChild(c);const names=c.querySelector('.cat-names');d.config.categories.forEach((name,i)=>{const row=document.createElement('div');row.className='category-name-row';row.innerHTML='<input class="category-name" maxlength="80"><button class="mini-btn">×</button>';row.querySelector('input').value=name;row.querySelector('button').onclick=()=>{if(names.children.length<=2)return;collectOne(el);d.config.categories.splice(i,1);d.config.assignments=d.config.assignments.map(x=>x===i?0:x>i?x-1:x);renderBody(el);};names.appendChild(row);});
 const items=c.querySelector('.cat-items');d.options.forEach((o,i)=>{const row=document.createElement('div');row.className='category-item-row';row.innerHTML=`<input class="category-item-text" maxlength="240"><select class="category-correct">${d.config.categories.map((x,j)=>`<option value="${j}">${esc(x)}</option>`).join('')}</select><button class="mini-btn">×</button>`;row.querySelector('input').value=o.text||'';row.querySelector('select').value=String(d.config.assignments[i]??0);row.querySelector('button').onclick=()=>{if(items.children.length<=2)return;collectOne(el);d.options.splice(i,1);d.config.assignments.splice(i,1);renderBody(el);};items.appendChild(row);});
 c.querySelector('.add-cat').onclick=()=>{collectOne(el);if(d.config.categories.length>=6)return;d.config.categories.push(`${d.config.categories.length+1}. kategória`);renderBody(el);};c.querySelector('.add-item').onclick=()=>{collectOne(el);if(d.options.length>=12)return;d.options.push({text:''});d.config.assignments.push(0);renderBody(el);};}

function renderImage(el){const host=el.querySelector('.image-host'),d=el._data;host.innerHTML=`<label>Kérdés képe</label><div class="image-dropzone"><input type="file" accept="image/*" hidden><div class="image-placeholder"><div class="image-dropzone-icon">🖼️</div><strong>${d.imageUrl?'Kép cseréje':'Kép hozzáadása'}</strong><span class="small">Kattints vagy húzz ide képet.</span></div>${d.imageUrl?`<img class="basic-image-preview" src="${d.imageUrl}">`:''}</div>`;const z=host.querySelector('.image-dropzone'),input=z.querySelector('input');z.querySelector('.image-placeholder').onclick=()=>input.click();input.onchange=()=>input.files[0]&&loadImage(el,input.files[0]);z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])loadImage(el,e.dataTransfer.files[0]);};if(d.questionType==='IMAGE_CLICK')host.classList.add('hidden');else host.classList.remove('hidden');}
function loadImage(el,file){if(!file.type.startsWith('image/'))return;const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);el._data.imageUrl=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(url);renderBody(el);};img.src=url;}

function renderPolygon(el,body){const d=el._data;el.querySelector('.answer-help').textContent='Tölts fel képet, kattintással vedd fel a polygon csúcspontjait. A pontokat utólag húzhatod; dupla kattintással törölheted.';const p=document.createElement('div');p.className='polygon-editor';p.innerHTML=`<div class="polygon-toolbar"><label class="btn compact upload-poly">${d.imageUrl?'Kép cseréje':'Kép feltöltése'}<input type="file" accept="image/*" hidden></label><button class="btn compact undo-poly">Utolsó pont vissza</button><button class="btn compact clear-poly">Polygon törlése</button></div><div class="polygon-stage ${d.imageUrl?'':'empty'}">${d.imageUrl?`<img src="${d.imageUrl}" draggable="false"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon></polygon><g class="vertices"></g></svg>`:'<div class="empty-poly">Először tölts fel egy képet.</div>'}</div><p class="small polygon-status"></p>`;body.appendChild(p);const inp=p.querySelector('input');inp.onchange=()=>inp.files[0]&&loadImage(el,inp.files[0]);p.querySelector('.undo-poly').onclick=()=>{d.config.polygon?.pop();renderBody(el);};p.querySelector('.clear-poly').onclick=()=>{d.config.polygon=[];renderBody(el);};if(d.imageUrl)setupPolygonStage(el,p.querySelector('.polygon-stage'));}
function setupPolygonStage(el,stage){const d=el._data,img=stage.querySelector('img'),svg=stage.querySelector('svg'),poly=svg.querySelector('polygon'),g=svg.querySelector('.vertices');const draw=()=>{const pts=d.config.polygon||[];poly.setAttribute('points',pts.map(v=>`${v.x*1000},${v.y*1000}`).join(' '));g.innerHTML='';pts.forEach((v,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',v.x*1000);c.setAttribute('cy',v.y*1000);c.setAttribute('r',16);c.dataset.i=i;c.addEventListener('dblclick',e=>{e.stopPropagation();d.config.polygon.splice(i,1);draw();});let active=false;c.addEventListener('pointerdown',e=>{active=true;c.setPointerCapture(e.pointerId);e.stopPropagation();});c.addEventListener('pointermove',e=>{if(!active)return;const q=pointFromEvent(e,img);d.config.polygon[i]=q;draw();});c.addEventListener('pointerup',()=>active=false);g.appendChild(c);});stage.querySelector('.polygon-status').textContent='';};stage.onclick=e=>{if(e.target.closest('circle'))return;const q=pointFromEvent(e,img);if(q.x>=0&&q.x<=1&&q.y>=0&&q.y<=1){d.config.polygon.push(q);draw();}};draw();}
function pointFromEvent(e,img){const r=img.getBoundingClientRect();return{x:+((e.clientX-r.left)/r.width).toFixed(4),y:+((e.clientY-r.top)/r.height).toFixed(4)};}

function collectOne(el){const d=el._data;d.questionText=el.querySelector('.question-text').value.trim();d.explanation=el.querySelector('.explanation').value.trim();d.questionType=el.querySelector('.question-type').value;d.timeLimitSeconds=+el.querySelector('.time-limit').value;d.points=+el.querySelector('.points').value||0;
 if(['SINGLE_SELECT','MULTI_SELECT','TRUE_FALSE'].includes(d.questionType)){d.options=[...el.querySelectorAll('.answer-editor')].map(r=>({text:r.querySelector('.answer-text').value.trim(),isCorrect:r.querySelector('.correct-marker').checked}));}
 else if(d.questionType==='ORDERING'){d.options=[...el.querySelectorAll('.ordering-editor-list .ordering-item')].map(r=>({text:r.querySelector('.answer-text').value.trim()}));}
 else if(d.questionType==='CATEGORIZATION'){d.config.categories=[...el.querySelectorAll('.category-name')].map(x=>x.value.trim());d.options=[...el.querySelectorAll('.category-item-row')].map(r=>({text:r.querySelector('.category-item-text').value.trim()}));d.config.assignments=[...el.querySelectorAll('.category-correct')].map(x=>+x.value);}
 return d;}
function collectAll(){return [...questionsEl.children].map(collectOne);}
function renumber(){[...questionsEl.children].forEach((e,i)=>e.querySelector('.question-number').textContent=`${i+1}. kérdés`);}
function bindItemSort(container,onChange){let dragged=null;container.onpointerdown=e=>{const h=e.target.closest('.drag-handle');if(!h)return;dragged=h.closest('.sortable-item');if(!dragged)return;h.setPointerCapture?.(e.pointerId);dragged.classList.add('dragging');e.preventDefault();};container.onpointermove=e=>{if(!dragged)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sortable-item');if(!t||t===dragged||t.parentElement!==container)return;const r=t.getBoundingClientRect();container.insertBefore(dragged,e.clientY<r.top+r.height/2?t:t.nextSibling);onChange?.();};container.onpointerup=()=>{dragged?.classList.remove('dragging');dragged=null;onChange?.();};container.onpointercancel=container.onpointerup;}
bindItemSort(questionsEl,renumber);

async function save(){const status=$('#status'),questions=collectAll(),title=$('#title').value.trim(),description=$('#description').value.trim();if(!title)return status.textContent='Adj címet a kvíznek.';for(let i=0;i<questions.length;i++){const q=questions[i];if(!q.questionText)return status.textContent=`${i+1}. kérdés: hiányzik a kérdés szövege.`;if(q.questionType==='IMAGE_CLICK'&&(!q.imageUrl||q.config.polygon.length<3))return status.textContent=`${i+1}. kérdés: kell kép és legalább 3 polygonpont.`;if(q.questionType==='MULTI_SELECT'&&q.options.filter(x=>x.isCorrect).length<2)return status.textContent=`${i+1}. kérdés: legalább 2 helyes választ jelölj.`;if(['SINGLE_SELECT','TRUE_FALSE'].includes(q.questionType)&&q.options.filter(x=>x.isCorrect).length!==1)return status.textContent=`${i+1}. kérdés: pontosan 1 helyes választ jelölj.`;if(!['IMAGE_CLICK'].includes(q.questionType)&&q.options?.some(x=>!x.text))return status.textContent=`${i+1}. kérdés: töltsd ki az elemeket.`;}
 status.textContent='Mentés…';const res=await fetch(editId?`/api/quizzes/${editId}`:'/api/quizzes',{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description,questions})});const data=await res.json();status.textContent=res.ok?'Mentve ✓':data.error||'Mentési hiba.';if(res.ok)setTimeout(()=>location.href='/admin/dashboard',500);}
$('#saveTop').onclick=$('#saveBottom').onclick=save;$('#addQuestion').onclick=()=>createQuestion();
$('#exportBtn').onclick=()=>{const data={title:$('#title').value,description:$('#description').value,questions:collectAll()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`${data.title||'quiz'}.json`;a.click();URL.revokeObjectURL(a.href);};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async()=>{try{const d=JSON.parse(await $('#importFile').files[0].text());$('#title').value=d.title||'';$('#description').value=d.description||'';questionsEl.innerHTML='';(d.questions||[]).forEach(createQuestion);if(!questionsEl.children.length)createQuestion();}catch{$('#status').textContent='Hibás JSON fájl.';}};

async function init(){if(!editId){createQuestion();return;}$('#pageTitle').textContent='Kvíz szerkesztése';const r=await fetch(`/api/quizzes/${editId}`),d=await r.json();if(!r.ok){$('#status').textContent=d.error;return;}const q=d.quiz;$('#title').value=q.title||'';$('#description').value=q.description||'';(q.questions||[]).forEach(x=>{const type=String(x.questionType||'single_select').toUpperCase();const correct=x.correctAnswer;const opts=(x.options||[]).map((o,i)=>({text:o.text||o,isCorrect:Array.isArray(correct)&&correct.includes(i)}));createQuestion({questionType:type,questionText:x.prompt,imageUrl:x.imageUrl,timeLimitSeconds:x.settings?.timeLimitSeconds||30,points:x.settings?.points||1000,explanation:x.settings?.explanation||'',options:opts,config:{categories:x.settings?.categories||[],assignments:type==='CATEGORIZATION'?(Array.isArray(correct)?correct:[]):[],polygon:type==='IMAGE_CLICK'?(correct?.polygon||[]):[]}});});if(!questionsEl.children.length)createQuestion();}
init();
</script></body></html>
