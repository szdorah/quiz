<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Új kvíz – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<main class="shell editor-shell">
  <section class="card quiz-builder-card">
    <div class="topbar"><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><span class="badge">Kvízszerkesztő</span></div>
    <div class="builder-intro">
      <div><h1 class="page-title">Új kvíz</h1><p>Állítsd össze a kérdéseket, válaszd ki a típust, az időkeretet és a pontértéket.</p></div>
      <div class="builder-actions-top"><a class="btn" href="/admin/dashboard">Mégse</a><button id="saveQuizTop" class="btn primary" type="button">Kvíz mentése</button></div>
    </div>
    <div class="quiz-meta-grid">
      <div><label for="title">Kvíz címe</label><input id="title" maxlength="120" placeholder="pl. Magasépítéstan 2 – 1. előadás" /></div>
      <div><label for="description">Rövid leírás</label><input id="description" maxlength="240" placeholder="Opcionális leírás" /></div>
    </div>
    <div class="section-head builder-section-head">
      <div><strong>Kérdések</strong><span class="small">Választás · igaz/hamis · sorrend · kategorizálás · képre kattintás</span></div>
      <button id="addQuestion" class="btn compact" type="button">+ Új kérdés</button>
    </div>
    <div id="questions"></div>
    <div class="actions builder-footer"><button id="saveQuiz" class="btn primary" type="button">Kvíz mentése</button><a class="btn" href="/admin/dashboard">Vissza a kvízekhez</a></div>
    <p id="status" class="small"></p>
  </section>
</main>
<script>
const questionsEl = document.getElementById('questions');
let questionCounter = 0;
const typeLabels = {
  SINGLE_SELECT:'Egy helyes válasz', MULTI_SELECT:'Több helyes válasz', TRUE_FALSE:'Igaz / hamis',
  ORDERING:'Sorrendbe rendezés', CATEGORIZATION:'Kategóriákba rendezés', IMAGE_CLICK:'Képre kattintás'
};

function optionRow(index, optionIndex, type, text='') {
  const isMulti = type === 'MULTI_SELECT';
  const tf = type === 'TRUE_FALSE';
  const ordering = type === 'ORDERING';
  return `<div class="answer-editor ${tf?'true-false-answer':''} ${ordering?'sortable-item ordering-editor-item':''}">
    ${ordering ? `<span class="drag-handle" title="Húzd">☰</span>` : `<input class="correct-marker" type="${isMulti?'checkbox':'radio'}" name="correct-${index}" value="${optionIndex}" ${optionIndex===0?'checked':''} />`}
    <span class="answer-letter">${tf ? (optionIndex===0?'✓':'×') : ordering ? optionIndex+1 : String.fromCharCode(65+optionIndex)}</span>
    <input class="answer-text" maxlength="240" value="${text}" placeholder="Válasz / elem" ${tf?'readonly':''} />
    ${ordering ? `<div class="order-controls"><button class="mini-btn move-up" type="button" title="Feljebb">↑</button><button class="mini-btn move-down" type="button" title="Lejjebb">↓</button><button class="mini-btn remove-order" type="button" title="Törlés">×</button></div>` : ''}
  </div>`;
}

function answerRows(index, type, count=4) {
  if (type === 'TRUE_FALSE') return optionRow(index,0,type,'Igaz') + optionRow(index,1,type,'Hamis');
  return Array.from({length:count},(_,i)=>optionRow(index,i,type,'')).join('');
}

function imageEditorHtml(index) {
  return `<div class="image-dropzone" data-image-zone>
    <input class="question-image-input" type="file" accept="image/*" hidden />
    <div class="image-placeholder"><div class="image-dropzone-icon">🖼️</div><strong>Kép hozzáadása</strong><span class="small">Kattints ide vagy húzz be egy képet.</span></div>
    <div class="image-preview-wrap hidden"><img class="image-preview" alt="Kérdés képe"/><span class="target-marker hidden"></span></div>
    <div class="image-actions hidden"><button class="btn compact replace-image" type="button">Kép cseréje</button><button class="btn compact remove-image" type="button">Kép törlése</button></div>
  </div>`;
}

function categoryEditorHtml() {
  return `<div class="category-editor">
    <div class="category-settings"><strong>Kategóriák</strong><div class="category-name-list">
      ${['1. kategória','2. kategória','3. kategória'].map((x,i)=>`<div class="category-name-row"><input class="category-name" value="${x}" maxlength="80"/><button class="mini-btn remove-category" type="button">×</button></div>`).join('')}
    </div><button class="btn compact add-category" type="button">+ Kategória</button></div>
    <div><div class="answers-block-head"><strong>Állítások / elemek</strong><span class="small">Minden elemhez add meg a helyes kategóriát.</span></div>
      <div class="category-item-list"></div><button class="btn compact add-category-item" type="button">+ Elem</button>
    </div>
  </div>`;
}

function categoryItemRow(categories, text='') {
  return `<div class="category-item-row"><input class="category-item-text" maxlength="240" value="${text}" placeholder="Elem / állítás"/><select class="category-correct">${categories.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><button class="mini-btn remove-category-item" type="button">×</button></div>`;
}

function addQuestion() {
  const index = questionCounter++;
  const wrap = document.createElement('section');
  wrap.className='question-editor question-editor-large';
  wrap.dataset.index=index;
  wrap.dataset.imageUrl='';
  wrap.dataset.target='';
  wrap.innerHTML=`
    <div class="question-editor-head"><div><strong class="question-number">${questionsEl.children.length+1}. kérdés</strong><span class="question-type-label small">${typeLabels.SINGLE_SELECT}</span></div><button class="btn compact danger remove-question" type="button">Törlés</button></div>
    <div class="question-editor-grid">
      <div class="question-main-column"><label>Kérdés szövege</label><textarea class="question-text question-text-large" rows="4" placeholder="Írd be a kérdést…"></textarea>${imageEditorHtml(index)}</div>
      <aside class="question-settings-panel">
        <label>Kérdéstípus</label><select class="question-type">
          <option value="SINGLE_SELECT">Egy helyes válasz</option><option value="MULTI_SELECT">Több helyes válasz</option><option value="TRUE_FALSE">Igaz / hamis</option><option value="ORDERING">Sorrendbe rendezés</option><option value="CATEGORIZATION">Kategóriákba rendezés</option><option value="IMAGE_CLICK">Képre kattintás</option>
        </select>
        <label>Időkeret</label><select class="time-limit"><option value="15">15 mp</option><option value="20">20 mp</option><option value="30" selected>30 mp</option><option value="45">45 mp</option><option value="60">60 mp</option><option value="90">90 mp</option></select>
        <label>Pont</label><input class="points" type="number" min="0" max="5000" value="1000" />
      </aside>
    </div>
    <div class="answers-block"><div class="answers-block-head"><label>Válaszok</label><span class="answer-help small">Jelöld az egyetlen helyes választ.</span></div><div class="option-list">${answerRows(index,'SINGLE_SELECT')}</div><div class="special-editor"></div></div>`;

  wrap.querySelector('.question-type').onchange=e=>renderType(wrap,e.target.value);
  wrap.querySelector('.remove-question').onclick=()=>{ if(questionsEl.children.length===1)return; wrap.remove(); renumber(); };
  setupImageEditor(wrap);
  questionsEl.appendChild(wrap); renumber();
}

function setupImageEditor(wrap) {
  const zone=wrap.querySelector('[data-image-zone]'); const input=zone.querySelector('.question-image-input');
  const choose=()=>input.click();
  zone.querySelector('.image-placeholder').onclick=choose; zone.querySelector('.replace-image').onclick=e=>{e.stopPropagation();choose();};
  zone.querySelector('.remove-image').onclick=e=>{e.stopPropagation();wrap.dataset.imageUrl='';wrap.dataset.target='';updateImagePreview(wrap);};
  zone.ondragover=e=>{e.preventDefault();zone.classList.add('drag-over');}; zone.ondragleave=()=>zone.classList.remove('drag-over');
  zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag-over'); if(e.dataTransfer.files[0]) loadImageFile(wrap,e.dataTransfer.files[0]);};
  input.onchange=()=>{ if(input.files[0]) loadImageFile(wrap,input.files[0]); input.value=''; };
  zone.querySelector('.image-preview-wrap').onclick=e=>{
    if(wrap.querySelector('.question-type').value!=='IMAGE_CLICK') return;
    const img=zone.querySelector('.image-preview'); const r=img.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    if(x<0||x>1||y<0||y>1)return;
    wrap.dataset.target=JSON.stringify({x:+x.toFixed(4),y:+y.toFixed(4),radius:0.09}); updateTargetMarker(wrap);
  };
}

async function loadImageFile(wrap,file){
  if(!file.type.startsWith('image/')) return;
  wrap.dataset.imageUrl=await compressImage(file); updateImagePreview(wrap);
}
function compressImage(file){
  return new Promise((resolve,reject)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{let w=img.width,h=img.height,max=1400;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.8));};img.onerror=reject;img.src=url;});
}
function updateImagePreview(wrap){
  const has=!!wrap.dataset.imageUrl, zone=wrap.querySelector('[data-image-zone]');
  zone.querySelector('.image-placeholder').classList.toggle('hidden',has); zone.querySelector('.image-preview-wrap').classList.toggle('hidden',!has); zone.querySelector('.image-actions').classList.toggle('hidden',!has);
  if(has) zone.querySelector('.image-preview').src=wrap.dataset.imageUrl; else zone.querySelector('.image-preview').removeAttribute('src');
  updateTargetMarker(wrap);
}
function updateTargetMarker(wrap){
  const marker=wrap.querySelector('.target-marker'); let t=null; try{t=JSON.parse(wrap.dataset.target||'null');}catch{}
  marker.classList.toggle('hidden',!t); if(t){marker.style.left=`${t.x*100}%`;marker.style.top=`${t.y*100}%`;marker.style.width=`${t.radius*200}%`;marker.style.aspectRatio='1';}
}

function renderType(wrap,type){
  wrap.querySelector('.question-type-label').textContent=typeLabels[type]; const list=wrap.querySelector('.option-list'); const special=wrap.querySelector('.special-editor'); const help=wrap.querySelector('.answer-help');
  list.classList.remove('hidden'); special.innerHTML='';
  if(type==='SINGLE_SELECT'||type==='MULTI_SELECT'||type==='TRUE_FALSE'){list.innerHTML=answerRows(wrap.dataset.index,type);help.textContent=type==='MULTI_SELECT'?'Jelöld be az összes helyes választ.':type==='TRUE_FALSE'?'Válaszd ki az igaz vagy hamis választ.':'Jelöld az egyetlen helyes választ.';}
  if(type==='ORDERING'){list.innerHTML=answerRows(wrap.dataset.index,type,4);help.innerHTML='Add meg a helyes sorrendet húzással vagy a nyilakkal. <button class="btn compact add-order-item" type="button">+ Elem</button>';setupOrderingEditor(wrap);}
  if(type==='CATEGORIZATION'){list.innerHTML='';list.classList.add('hidden');help.textContent='Hozd létre a kategóriákat, majd rendeld hozzá az elemeket.';special.innerHTML=categoryEditorHtml();setupCategoryEditor(wrap);}
  if(type==='IMAGE_CLICK'){list.innerHTML='';list.classList.add('hidden');help.textContent='Tölts fel egy képet, majd kattints a képen arra a pontra, amelyet helyesnek fogadunk el.';special.innerHTML='<div class="future-note">🎯 A képen megjelenő célkör jelzi az elfogadott területet.</div>';}
  updateTargetMarker(wrap);
}

function setupOrderingEditor(wrap){
  const list=wrap.querySelector('.option-list'); enablePointerSort(list); renumberOrdering(list); bindOrderButtons(wrap);
  wrap.querySelector('.add-order-item').onclick=()=>{const count=list.querySelectorAll('.ordering-editor-item').length;if(count>=10)return;list.insertAdjacentHTML('beforeend',optionRow(wrap.dataset.index,count,'ORDERING',''));renumberOrdering(list);bindOrderButtons(wrap);};
}
function bindOrderButtons(wrap){
  const list=wrap.querySelector('.option-list');
  list.querySelectorAll('.move-up').forEach(b=>b.onclick=()=>moveOrder(b.closest('.ordering-editor-item'),-1));
  list.querySelectorAll('.move-down').forEach(b=>b.onclick=()=>moveOrder(b.closest('.ordering-editor-item'),1));
  list.querySelectorAll('.remove-order').forEach(b=>b.onclick=()=>{if(list.children.length<=2)return;b.closest('.ordering-editor-item').remove();renumberOrdering(list);});
}
function moveOrder(row,delta){const list=row.parentElement;const rows=[...list.children];const i=rows.indexOf(row),j=i+delta;if(j<0||j>=rows.length)return;if(delta<0)list.insertBefore(row,rows[j]);else list.insertBefore(rows[j],row);renumberOrdering(list);}
function enablePointerSort(container){let dragged=null,pid=null;container.onpointerdown=e=>{const h=e.target.closest('.drag-handle');if(!h)return;dragged=h.closest('.sortable-item');pid=e.pointerId;h.setPointerCapture?.(pid);dragged.classList.add('dragging');e.preventDefault();};container.onpointermove=e=>{if(!dragged||e.pointerId!==pid)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.sortable-item');if(!t||t===dragged||t.parentElement!==container)return;const r=t.getBoundingClientRect();container.insertBefore(dragged,e.clientY<r.top+r.height/2?t:t.nextSibling);renumberOrdering(container);};const stop=e=>{if(!dragged)return;dragged.classList.remove('dragging');dragged=null;pid=null;};container.onpointerup=stop;container.onpointercancel=stop;}
function renumberOrdering(container){[...container.querySelectorAll('.ordering-editor-item')].forEach((r,i)=>r.querySelector('.answer-letter').textContent=i+1);}

function setupCategoryEditor(wrap){
  const editor=wrap.querySelector('.category-editor'), names=editor.querySelector('.category-name-list'), items=editor.querySelector('.category-item-list');
  const refresh=()=>{const cats=[...names.querySelectorAll('.category-name')].map((x,i)=>x.value.trim()||`${i+1}. kategória`);items.querySelectorAll('.category-correct').forEach(s=>{const old=+s.value;s.innerHTML=cats.map((c,i)=>`<option value="${i}" ${i===old?'selected':''}>${escapeHtml(c)}</option>`).join('');});};
  const bind=()=>{names.querySelectorAll('.category-name').forEach(x=>x.oninput=refresh);names.querySelectorAll('.remove-category').forEach(b=>b.onclick=()=>{if(names.children.length<=2)return;b.parentElement.remove();refresh();});items.querySelectorAll('.remove-category-item').forEach(b=>b.onclick=()=>{if(items.children.length<=2)return;b.parentElement.remove();});};
  editor.querySelector('.add-category').onclick=()=>{if(names.children.length>=5)return;names.insertAdjacentHTML('beforeend',`<div class="category-name-row"><input class="category-name" value="${names.children.length+1}. kategória" maxlength="80"/><button class="mini-btn remove-category" type="button">×</button></div>`);bind();refresh();};
  editor.querySelector('.add-category-item').onclick=()=>{if(items.children.length>=12)return;const cats=[...names.querySelectorAll('.category-name')].map(x=>x.value);items.insertAdjacentHTML('beforeend',categoryItemRow(cats));bind();};
  const cats=[...names.querySelectorAll('.category-name')].map(x=>x.value); for(let i=0;i<6;i++)items.insertAdjacentHTML('beforeend',categoryItemRow(cats)); bind();
}

function renumber(){[...questionsEl.children].forEach((el,i)=>el.querySelector('.question-number').textContent=`${i+1}. kérdés`);}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

function collectQuestions(){return [...questionsEl.children].map(el=>{
  const type=el.querySelector('.question-type').value, base={questionText:el.querySelector('.question-text').value.trim(),questionType:type,imageUrl:el.dataset.imageUrl||null,timeLimitSeconds:+el.querySelector('.time-limit').value,points:+el.querySelector('.points').value||1000,options:[],config:{}};
  if(type==='CATEGORIZATION'){base.config.categories=[...el.querySelectorAll('.category-name')].map(x=>x.value.trim());base.options=[...el.querySelectorAll('.category-item-row')].map(r=>({text:r.querySelector('.category-item-text').value.trim(),imageUrl:null,isCorrect:false}));base.config.assignments=[...el.querySelectorAll('.category-correct')].map(x=>+x.value);return base;}
  if(type==='IMAGE_CLICK'){try{base.config.target=JSON.parse(el.dataset.target||'null');}catch{base.config.target=null;}return base;}
  const rows=[...el.querySelectorAll('.answer-editor')], correct=[...el.querySelectorAll('.correct-marker')].filter(x=>x.checked).map(x=>+x.value);base.options=rows.map((r,i)=>({text:r.querySelector('.answer-text').value.trim(),imageUrl:null,isCorrect:type==='ORDERING'?true:correct.includes(i)}));return base;
});}

async function saveQuiz(){const status=document.getElementById('status'),title=document.getElementById('title').value.trim(),description=document.getElementById('description').value.trim(),questions=collectQuestions();if(!title){status.textContent='Adj címet a kvíznek.';return;}
  for(const [i,q] of questions.entries()){const n=`${i+1}. kérdés:`;if(!q.questionText){status.textContent=`${n} add meg a kérdés szövegét.`;return;}if(q.questionType==='IMAGE_CLICK'){if(!q.imageUrl){status.textContent=`${n} tölts fel képet.`;return;}if(!q.config.target){status.textContent=`${n} jelöld ki a helyes pontot a képen.`;return;}continue;}if(q.options.length<2||q.options.some(o=>!o.text)){status.textContent=`${n} töltsd ki az elemeket/válaszokat.`;return;}if(q.questionType==='ORDERING'){if(q.options.length>10){status.textContent=`${n} legfeljebb 10 elem lehet.`;return;}continue;}if(q.questionType==='CATEGORIZATION'){if(q.config.categories.length<2||q.config.categories.some(x=>!x)){status.textContent=`${n} legalább két kategória kell.`;return;}continue;}const c=q.options.filter(o=>o.isCorrect).length;if(!c){status.textContent=`${n} jelölj helyes választ.`;return;}if(q.questionType!=='MULTI_SELECT'&&c!==1){status.textContent=`${n} pontosan egy helyes válasz szükséges.`;return;}if(q.questionType==='MULTI_SELECT'&&c<2){status.textContent=`${n} legalább két helyes válasz kell.`;return;}}
  document.getElementById('saveQuiz').disabled=document.getElementById('saveQuizTop').disabled=true;status.textContent='Mentés…';const res=await fetch('/api/quizzes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description,questions})});const data=await res.json();if(!res.ok){document.getElementById('saveQuiz').disabled=document.getElementById('saveQuizTop').disabled=false;status.textContent=data.error||'Nem sikerült menteni.';return;}location.href='/admin/dashboard';}

document.getElementById('addQuestion').onclick=addQuestion;document.getElementById('saveQuiz').onclick=saveQuiz;document.getElementById('saveQuizTop').onclick=saveQuiz;addQuestion();
</script>
</body>
</html>
