<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Új kvíz – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card form-card wide-form">
      <div class="topbar">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <span class="badge">Új kvíz</span>
      </div>
      <h1 class="page-title">Új kvíz</h1>
      <p>Első körben egyválaszos kérdéseket készítünk. Az adatmodell már elő van készítve több kérdéstípushoz és képekhez is.</p>

      <label for="title">Kvíz címe</label>
      <input id="title" maxlength="120" placeholder="pl. Magasépítéstan 2 – 1. előadás" />

      <label for="description">Rövid leírás</label>
      <input id="description" maxlength="240" placeholder="Opcionális leírás" />

      <div class="section-head">
        <div>
          <strong>Kérdések</strong>
          <span class="small">Most: egy helyes válasz · később: több válasz, igaz/hamis, számérték, párosítás, képes kérdés stb.</span>
        </div>
        <button id="addQuestion" class="btn compact" type="button">+ Kérdés</button>
      </div>

      <div id="questions"></div>

      <div class="actions">
        <button id="saveQuiz" class="btn primary" type="button">Kvíz mentése</button>
        <a class="btn" href="/admin/dashboard">Vissza a kvízekhez</a>
      </div>
      <p id="status" class="small"></p>
    </section>
  </main>

  <script>
    const questionsEl = document.getElementById('questions');
    let questionCounter = 0;

    function addQuestion() {
      const index = questionCounter++;
      const wrap = document.createElement('section');
      wrap.className = 'question-editor';
      wrap.dataset.index = index;
      wrap.innerHTML = `
        <div class="question-editor-head">
          <strong class="question-number">${questionsEl.children.length + 1}. kérdés</strong>
          <button class="btn compact danger remove-question" type="button">Törlés</button>
        </div>
        <label>Kérdés szövege</label>
        <textarea class="question-text" rows="3" placeholder="Írd be a kérdést…"></textarea>
        <div class="inline-fields">
          <div>
            <label>Időkeret</label>
            <select class="time-limit">
              <option value="15">15 mp</option>
              <option value="20">20 mp</option>
              <option value="30" selected>30 mp</option>
              <option value="45">45 mp</option>
              <option value="60">60 mp</option>
            </select>
          </div>
          <div>
            <label>Pont</label>
            <input class="points" type="number" min="0" max="5000" value="1000" />
          </div>
        </div>
        <label>Válaszok <span class="small">– jelöld a helyeset</span></label>
        <div class="option-list">
          ${['A','B','C','D'].map((letter, optionIndex) => `
            <label class="answer-editor">
              <input type="radio" name="correct-${index}" value="${optionIndex}" ${optionIndex === 0 ? 'checked' : ''} />
              <span class="answer-letter">${letter}</span>
              <input class="answer-text" maxlength="240" placeholder="${letter} válasz" />
            </label>`).join('')}
        </div>
        <div class="future-note">🖼️ Képfeltöltés és további kérdéstípusok a következő fejlesztési körökben.</div>
      `;
      wrap.querySelector('.remove-question').onclick = () => {
        if (questionsEl.children.length === 1) return;
        wrap.remove();
        renumber();
      };
      questionsEl.appendChild(wrap);
      renumber();
    }

    function renumber() {
      [...questionsEl.children].forEach((el, i) => {
        el.querySelector('.question-number').textContent = `${i + 1}. kérdés`;
      });
    }

    function collectQuestions() {
      return [...questionsEl.children].map(el => {
        const correctIndex = Number(el.querySelector('input[type=radio]:checked').value);
        return {
          questionText: el.querySelector('.question-text').value.trim(),
          questionType: 'SINGLE_SELECT',
          imageUrl: null,
          timeLimitSeconds: Number(el.querySelector('.time-limit').value),
          points: Number(el.querySelector('.points').value || 1000),
          options: [...el.querySelectorAll('.answer-text')].map((input, i) => ({
            text: input.value.trim(),
            imageUrl: null,
            isCorrect: i === correctIndex,
          }))
        };
      });
    }

    document.getElementById('addQuestion').onclick = addQuestion;
    document.getElementById('saveQuiz').onclick = async () => {
      const status = document.getElementById('status');
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const questions = collectQuestions();

      if (!title) { status.textContent = 'Adj címet a kvíznek.'; return; }
      for (const q of questions) {
        if (!q.questionText) { status.textContent = 'Minden kérdésnek legyen szövege.'; return; }
        if (q.options.some(o => !o.text)) { status.textContent = 'Töltsd ki mind a négy válaszlehetőséget.'; return; }
      }

      status.textContent = 'Mentés…';
      const res = await fetch('/api/quizzes', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({title, description, questions})
      });
      const data = await res.json();
      if (!res.ok) { status.textContent = data.error || 'Nem sikerült menteni.'; return; }
      location.href = '/admin/dashboard';
    };

    addQuestion();
  </script>
</body>
</html>
