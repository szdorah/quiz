<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvízszerkesztő – SZAGRI Quiz</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="shell editor-shell"><section class="card quiz-builder-card"><div class="topbar"><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><span class="badge">Kvízszerkesztő</span></div><div class="builder-intro"><div><h1 id="pageTitle" class="page-title">Új kvíz</h1><p>Kérdések létrehozása, másolása, átrendezése és polygonos képkérdések.</p></div><div class="builder-actions-top"><button id="importBtn" class="btn">Import JSON</button><button id="exportBtn" class="btn">Export JSON</button><a class="btn" href="/admin/dashboard">Mégse</a><button id="saveTop" class="btn primary">Mentés</button></div></div><input id="importFile" type="file" accept="application/json" hidden><div class="quiz-meta-grid"><div><label>Kvíz címe</label><input id="title" maxlength="120"></div><div><label>Rövid leírás</label><input id="description" maxlength="240"></div></div><div class="section-head builder-section-head"><div><strong>Kérdések</strong><span class="small">A ☰ jellel húzhatók sorrendbe.</span></div><button id="addQuestion" class="btn compact">+ Új kérdés</button></div><div id="questions"></div><div class="actions builder-footer"><button id="saveBottom" class="btn primary">Mentés</button><a class="btn" href="/admin/dashboard">Vissza</a></div><p id="status" class="small"></p></section></main>
<script>
const $=s=>document.querySelector(s), editId=new URLSearchParams(location.search).get('id');let seq=0;
const labels={SINGLE_SELECT:'Egy helyes válasz',MULTI_SELECT:'Több helyes válasz',TRUE_FALSE:'Igaz / hamis',ORDERING:'Sorrendbe rendezés',CATEGORIZATION:'Kategóriákba rendezés',IMAGE_CLICK:'Képre kattintás – polygon'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({questionType:'SINGLE_SELECT',questionText:'',imageUrl:null,timeLimitSeconds:30,points:1000,explanation:'',options:[{text:'',isCorrect:true},{text:'',isCorrect:false},{text:'',isCorrect:false},{text:'',isCorrect:false}],config:{}});
function normalize(d){d=structuredClone(d||blank());d.questionType=String(d.questionType||'SINGLE_SELECT').toUpperCase();d.config=d.config||{};d.options=Array.isArray(d.options)?d.options:[];if(d.questionType==='TRUE_FALSE')d.options=[{text:'Igaz',isCorrect:d.options[0]?.isCorrect!==false},{text:'Hamis',isCorrect:!!d.options[1]?.isCorrect}];if(d.questionType==='ORDERING'&&d.options.length<2)d.options=[{text:''},{text:''},{text:''},{text:''}];if(d.questionType==='CATEGORIZATION'){d.config.categories=d.config.categories?.length>=2?d.config.categories:['1. kategória','2. kategória','3. kategória'];if(d.options.length<2)d.options=[{text:''},{text:''},{text:''},{text:''}];d.config.assignments=Array.isArray(d.config.assignments)?d.config.assignments:Array(d.options.length).fill(0);}if(d.questionType==='IMAGE_CLICK'){d.options=[];d.config.polygon=Array.isArray(d.config.polygon)?d.config.polygon:[];}if(['SINGLE_SELECT','MULTI_SELECT'].includes(d.questionType)&&!d.options.length)d.options=blank().options;return d;}
function addQuestion(data,after=null){const d=normalize(data||blank()),el=document.createElement('section');el.className='question-editor question-sortable';el.dataset.uid=seq++;el._d=d;el.innerHTML=`<div class="question-editor-head"><div><span class="drag-handle question-handle">☰</span><strong class="qno"></strong><span class="qtype small"></span></div><div class="question-head-actions"><button class="btn compact dup">Másolás</button><button class="btn compact danger del">Törlés</button></div></div><div class="question-editor-grid"><div><label>Kérdés szövege</label><textarea class="question-text question-text-large" rows="3"></textarea><label>Válaszmagyarázat <span class="small">(opcionális)</span></label><textarea class="explanation" rows="2"></textarea><div class="normal-image"></div></div><aside class="question-settings-panel"><label>Kérdéstípus</label><select class="question-type">${Object.entries(labels).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select><label>Időkeret</label><select class="time-limit">${[15,20,30,45,60,90,120].map(v=>`<option value="${v}">${v} mp</option>`).join('')}</select><label>Pont</label><input class="points" type="number" min="0" max="5000"></aside></div><div class="answers-block"><div class="answers-block-head"><strong>Válasz / megoldás</strong><span class="help small"></span></div><div class="body"></div></div>`;el.querySelector('.question-text').value=d.questionText||d.prompt||'';el.querySelector('.explanation').value=d.explanation||d.settings?.explanation||'';el.querySelector('.question-type').value=d.questionType;el.querySelector('.time-limit').value=String(d.timeLimitSeconds||d.settings?.timeLimitSeconds||30);el.querySelector('.points').value=d.points??d.settings?.points??1000;el.querySelector('.question-type').onchange=e=>{sync(el);el._d.questionType=e.target.value;el._d=normalize(el._d);render(el)};el.querySelector('.dup').onclick=()=>{sync(el);addQuestion(el._d,el)};el.querySelector('.del').onclick=()=>{if($('#questions').children.length<=1)return;el.remove();renumber()};if(after)after.after(el);else $('#questions').appendChild(el);render(el);renumber();return el;}
function render(el){const d=el._d;el.querySelector('.qtype').textContent=labels[d.questionType];const b=el.querySelector('.body');b.innerHTML='';renderNormalImage(el);if(['SINGLE_SELECT','MULTI_SELECT','TRUE_FALSE'].includes(d.questionType))choices(el,b);else if(d.questionType==='ORDERING')ordering(el,b);else if(d.questionType==='CATEGORIZATION')categories(el,b);else polygon(el,b);}
function renderNormalImage(el){const d=el._d,h=el.querySelector('.normal-image');h.classList.toggle('hidden',d.questionType==='IMAGE_CLICK');if(d.questionType==='IMAGE_CLICK')return;h.innerHTML=`<label>Kérdés képe</label><div class="image-dropzone"><input type="file" accept="image/*" hidden><div class="image-placeholder"><div class="image-dropzone-icon">🖼️</div><strong>${d.imageUrl?'Kép cseréje':'Kép hozzáadása'}</strong></div>${d.imageUrl?`<img class="basic-image-preview" src="${d.imageUrl}">`:''}</div>`;const z=h.querySelector('.image-dropzone'),f=h.querySelector('input');z.querySelector('.image-placeholder').onclick=()=>f.click();f.onchange=()=>f.files[0]&&loadImage(el,f.files[0]);z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&loadImage(el,e.dataTransfer.files[0])};}
function choices(el,b){const d=el._d,m=d.questionType==='MULTI_SELECT',tf=d.questionType==='TRUE_FALSE';el.querySelector('.help').textContent=m?'Több helyes válasz is megadható; a hallgató részpontot is kaphat.':'Jelöld a helyes választ.';d.options.forEach((o,i)=>{const r=document.createElement('div');r.className='answer-editor';r.innerHTML=`<input class="correct-marker" type="${m?'checkbox':'radio'}" name="c${el.dataset.uid}" ${o.isCorrect?'checked':''}><span class="answer-letter">${tf?(i?'×':'✓'):String.fromCharCode(65+i)}</span><input class="answer-text" maxlength="240" ${tf?'readonly':''}>`;r.querySelector('.answer-text').value=o.text||'';b.appendChild(r)});}
function ordering(el,b){const d=el._d;el.querySelector('.help').textContent='Helyes sorrend; maximum 10 elem.';const l=document.createElement('div');l.className='ordering-editor-list';d.options.forEach(o=>{const r=document.createElement('div');r.className='ordering-item sortable-item';r.innerHTML='<span class="drag-handle">☰</span><span class="ordering-position"></span><input class="answer-text"><div class="order-controls"><button class="mini-btn up">↑</button><button class="mini-btn down">↓</button><button class="mini-btn rem">×</button></div>';r.querySelector('.answer-text').value=o.text||'';r.querySelector('.up').onclick=()=>move(r,-1);r.querySelector('.down').onclick=()=>move(r,1);r.querySelector('.rem').onclick=()=>{if(l.children.length<=2)return;r.remove();renumOrder(l)};l.appendChild(r)});b.appendChild(l);bindSort(l,'.sortable-item',renumOrder);renumOrder(l);const add=document.createElement('button');add.className='btn compact';add.textContent='+ Elem';add.onclick=()=>{sync(el);if(el._d.options.length>=10)return;el._d.options.push({text:''});render(el)};b.appendChild(add);}
function move(r,d){const a=[...r.parentElement.children],i=a.indexOf(r),j=i+d;if(j<0||j>=a.length)return;if(d<0)r.parentElement.insertBefore(r,a[j]);else r.parentElement.insertBefore(a[j],r);renumOrder(r.parentElement)}function renumOrder(l){[...l.children].forEach((x,i)=>x.querySelector('.ordering-position').textContent=i+1)}
function categories(el,b){const d=el._d;el.querySelector('.help').textContent='Kategóriák és a hozzájuk tartozó elemek.';b.innerHTML='<div class="category-editor"><div><strong>Kategóriák</strong><div class="catNames"></div><button class="btn compact addCat">+ Kategória</button></div><div><strong>Elemek</strong><div class="catItems"></div><button class="btn compact addItem">+ Elem</button></div></div>';const ns=b.querySelector('.catNames');d.config.categories.forEach((x,i)=>{const r=document.createElement('div');r.className='category-name-row';r.innerHTML='<input class="category-name"><button class="mini-btn">×</button>';r.querySelector('input').value=x;r.querySelector('button').onclick=()=>{if(d.config.categories.length<=2)return;sync(el);el._d.config.categories.splice(i,1);el._d.config.assignments=el._d.config.assignments.map(v=>v===i?0:v>i?v-1:v);render(el)};ns.appendChild(r)});const is=b.querySelector('.catItems');d.options.forEach((o,i)=>{const r=document.createElement('div');r.className='category-item-row';r.innerHTML=`<input class="category-item-text"><select class="category-correct">${d.config.categories.map((x,j)=>`<option value="${j}">${esc(x)}</option>`).join('')}</select><button class="mini-btn">×</button>`;r.querySelector('input').value=o.text||'';r.querySelector('select').value=String(d.config.assignments[i]??0);r.querySelector('button').onclick=()=>{if(d.options.length<=2)return;sync(el);el._d.options.splice(i,1);el._d.config.assignments.splice(i,1);render(el)};is.appendChild(r)});b.querySelector('.addCat').onclick=()=>{sync(el);if(el._d.config.categories.length>=6)return;el._d.config.categories.push(`${el._d.config.categories.length+1}. kategória`);render(el)};b.querySelector('.addItem').onclick=()=>{sync(el);if(el._d.options.length>=12)return;el._d.options.push({text:''});el._d.config.assignments.push(0);render(el)};}
function polygon(el,b){const d=el._d;el.querySelector('.help').textContent='Kattintással adj hozzá csúcspontokat; a pontokat húzhatod, dupla kattintással törölheted.';b.innerHTML=`<div class="polygon-toolbar"><label class="btn compact">${d.imageUrl?'Kép cseréje':'Kép feltöltése'}<input class="polyFile" type="file" accept="image/*" hidden></label><button class="btn compact undo">Utolsó pont vissza</button><button class="btn compact clear">Polygon törlése</button></div><div class="polyHolder"></div><p class="small polyStatus"></p>`;b.querySelector('.polyFile').onchange=e=>e.target.files[0]&&loadImage(el,e.target.files[0]);b.querySelector('.undo').onclick=()=>{d.config.polygon.pop();drawPolygon(el)};b.querySelector('.clear').onclick=()=>{d.config.polygon=[];drawPolygon(el)};drawPolygon(el);}
function drawPolygon(el){const b=el.querySelector('.body'),h=b.querySelector('.polyHolder'),d=el._d,s=b.querySelector('.polyStatus');if(!h)return;if(!d.imageUrl){h.innerHTML='<div class="polygon-stage empty"><div class="empty-poly">Először tölts fel egy képet.</div></div>';s.textContent='';return}h.innerHTML=`<div class="polygon-stage"><img src="${d.imageUrl}" draggable="false"><svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon></polygon><g></g></svg></div>`;const stage=h.firstElementChild,img=stage.querySelector('img'),svg=stage.querySelector('svg'),poly=svg.querySelector('polygon'),g=svg.querySelector('g'),pts=d.config.polygon;poly.setAttribute('points',pts.map(v=>`${v.x*1000},${v.y*1000}`).join(' '));pts.forEach((v,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',v.x*1000);c.setAttribute('cy',v.y*1000);c.setAttribute('r',16);let active=false,pid=null;c.ondblclick=e=>{e.stopPropagation();d.config.polygon.splice(i,1);drawPolygon(el)};c.onpointerdown=e=>{active=true;pid=e.pointerId;c.setPointerCapture?.(pid);e.stopPropagation();e.preventDefault()};c.onpointermove=e=>{if(!active||e.pointerId!==pid)return;d.config.polygon[i]=relPoint(e,img);drawPolygon(el)};c.onpointerup=c.onpointercancel=()=>active=false;g.appendChild(c)});stage.onclick=e=>{if(e.target.tagName.toLowerCase()==='circle')return;const p=relPoint(e,img);if(p.x>=0&&p.x<=1&&p.y>=0&&p.y<=1){d.config.polygon.push(p);drawPolygon(el)}};s.textContent=pts.length<3?`${pts.length} pont – legalább 3 kell.`:`${pts.length} polygonpont. A terület kész.`;}
function relPoint(e,img){const r=img.getBoundingClientRect();return{x:+((e.clientX-r.left)/r.width).toFixed(4),y:+((e.clientY-r.top)/r.height).toFixed(4)}}
function loadImage(el,file){if(!file.type.startsWith('image/'))return;const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,k=Math.min(1,1600/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);el._d.imageUrl=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);render(el)};img.src=u;}
function sync(el){const d=el._d;d.questionText=el.querySelector('.question-text').value.trim();d.explanation=el.querySelector('.explanation').value.trim();d.questionType=el.querySelector('.question-type').value;d.timeLimitSeconds=+el.querySelector('.time-limit').value;d.points=+el.querySelector('.points').value||0;if(['SINGLE_SELECT','MULTI_SELECT','TRUE_FALSE'].includes(d.questionType))d.options=[...el.querySelectorAll('.answer-editor')].map(r=>({text:r.querySelector('.answer-text').value.trim(),isCorrect:r.querySelector('.correct-marker').checked}));else if(d.questionType==='ORDERING')d.options=[...el.querySelectorAll('.ordering-item')].map(r=>({text:r.querySelector('.answer-text').value.trim()}));else if(d.questionType==='CATEGORIZATION'){d.config.categories=[...el.querySelectorAll('.category-name')].map(x=>x.value.trim());d.options=[...el.querySelectorAll('.category-item-row')].map(r=>({text:r.querySelector('.category-item-text').value.trim()}));d.config.assignments=[...el.querySelectorAll('.category-correct')].map(x=>+x.value)}return d}
function renumber(){[...$('#questions').children].forEach((x,i)=>x.querySelector('.qno').textContent=`${i+1}. kérdés`)}
function bindSort(root,itemSelector,after){let drag=null,pid=null;root.onpointerdown=e=>{const h=e.target.closest('.drag-handle');if(!h)return;drag=h.closest(itemSelector);if(!drag)return;pid=e.pointerId;h.setPointerCapture?.(pid);drag.classList.add('dragging');e.preventDefault()};root.onpointermove=e=>{if(!drag||e.pointerId!==pid)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest(itemSelector);if(!t||t===drag||t.parentElement!==root)return;const r=t.getBoundingClientRect();root.insertBefore(drag,e.clientY<r.top+r.height/2?t:t.nextSibling);after?.(root)};root.onpointerup=root.onpointercancel=()=>{drag?.classList.remove('dragging');drag=null;pid=null;after?.(root)}}bindSort($('#questions'),'.question-sortable',()=>renumber());
async function save(){const qs=[...$('#questions').children].map(sync),title=$('#title').value.trim(),description=$('#description').value.trim(),st=$('#status');if(!title)return st.textContent='Adj címet a kvíznek.';for(let i=0;i<qs.length;i++){const q=qs[i];if(!q.questionText)return st.textContent=`${i+1}. kérdés: hiányzik a szöveg.`;if(q.questionType==='IMAGE_CLICK'&&(!q.imageUrl||q.config.polygon.length<3))return st.textContent=`${i+1}. kérdés: kell kép és legalább 3 polygonpont.`;if(q.questionType==='MULTI_SELECT'&&q.options.filter(x=>x.isCorrect).length<2)return st.textContent=`${i+1}. kérdés: legalább két helyes válasz kell.`;if(['SINGLE_SELECT','TRUE_FALSE'].includes(q.questionType)&&q.options.filter(x=>x.isCorrect).length!==1)return st.textContent=`${i+1}. kérdés: pontosan egy helyes válasz kell.`;if(q.questionType!=='IMAGE_CLICK'&&q.options.some(x=>!x.text))return st.textContent=`${i+1}. kérdés: tölts ki minden elemet.`}st.textContent='Mentés…';const r=await fetch(editId?`/api/quizzes/${editId}`:'/api/quizzes',{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description,questions:qs})}),d=await r.json();if(!r.ok)return st.textContent=d.error||'Mentési hiba.';st.textContent='Mentve ✓';setTimeout(()=>location.href='/admin/dashboard',400)}
$('#addQuestion').onclick=()=>addQuestion();$('#saveTop').onclick=$('#saveBottom').onclick=save;$('#exportBtn').onclick=()=>{const d={title:$('#title').value,description:$('#description').value,questions:[...$('#questions').children].map(sync)},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=(d.title||'quiz')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());$('#title').value=d.title||'';$('#description').value=d.description||'';$('#questions').innerHTML='';(d.questions||[]).forEach(x=>addQuestion(x));if(!$('#questions').children.length)addQuestion()}catch{$('#status').textContent='Hibás JSON fájl.'}};
async function init(){if(!editId){addQuestion();return}$('#pageTitle').textContent='Kvíz szerkesztése';const r=await fetch(`/api/quizzes/${editId}`),d=await r.json();if(!r.ok)return $('#status').textContent=d.error;const z=d.quiz;$('#title').value=z.title||'';$('#description').value=z.description||'';(z.questions||[]).forEach(x=>{const t=String(x.questionType||'single_select').toUpperCase(),ca=x.correctAnswer,opts=(x.options||[]).map((o,i)=>({text:typeof o==='string'?o:o.text||'',isCorrect:Array.isArray(ca)&&ca.includes(i)}));addQuestion({questionType:t,questionText:x.prompt,imageUrl:x.imageUrl,timeLimitSeconds:x.settings?.timeLimitSeconds||30,points:x.settings?.points||1000,explanation:x.settings?.explanation||'',options:opts,config:{categories:x.settings?.categories||[],assignments:t==='CATEGORIZATION'&&Array.isArray(ca)?ca:[],polygon:t==='IMAGE_CLICK'?(ca?.polygon||[]):[]}})});if(!$('#questions').children.length)addQuestion()}init();
</script></body></html>
