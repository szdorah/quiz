<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BME Tesztek – SzD · Tanköri bemutatkozás</title><style>:root{--t:#0f766e;--t2:#115e59;--m:#dff7ef;--i:#18302d;--u:#647773;--l:#d9e9e4}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf8f4,#f8fbfa 300px,#f4f7f6);color:var(--i)}.wrap{max-width:840px;margin:auto;padding:24px 18px 70px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--t2);font-weight:850}.brand b{display:flex;align-items:center;gap:9px}.logo{width:31px;height:31px;border-radius:10px;background:var(--t);color:#fff;display:grid;place-items:center}.hero{background:linear-gradient(135deg,#0f766e,#1a9185);color:#fff;border-radius:26px;padding:32px;box-shadow:0 18px 45px rgba(15,118,110,.14)}.hero h1{font-size:clamp(31px,6vw,46px);margin:8px 0 10px}.hero p{line-height:1.55}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;opacity:.82}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 11px;border:1px solid #ffffff38;border-radius:999px;background:#ffffff1c;font-size:13px}.notice,.q,.done{background:#fff;border:1px solid var(--l);border-radius:19px}.notice{padding:15px 18px;margin:18px 0;color:var(--u);font-size:14px}.section{font-size:13px;color:var(--t);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:28px 4px 9px}.q{padding:20px;margin:11px 0}.head{display:flex;gap:12px}.num{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:var(--m);color:var(--t2);display:grid;place-items:center;font-weight:900;font-size:13px}.label{font-size:17px;font-weight:760}.help{margin:5px 0 0 42px;color:var(--u);font-size:13px}.ans{margin:15px 0 0 42px}input[type=text],textarea{width:100%;border:1.5px solid #cfe0db;border-radius:12px;padding:12px;font:inherit;background:#fbfdfc}textarea{min-height:90px}.choice{display:flex;gap:10px;padding:10px 12px;border:1px solid #dceae6;border-radius:12px;margin:7px 0;background:#fbfdfc}.choice input,.scale input{accent-color:var(--t)}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale label{display:grid;place-items:center;padding:9px;border:1px solid #dceae6;border-radius:12px}.labels{display:flex;justify-content:space-between;color:var(--u);font-size:12px;margin-top:6px}.progress{position:sticky;top:0;padding:8px 0;background:#f4f9f7e8;backdrop-filter:blur(8px);z-index:3}.track{height:8px;border-radius:999px;background:#dcebe6;overflow:hidden}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#0f766e,#45b7aa)}.actions{display:flex;gap:12px;align-items:center;margin-top:22px}.btn{border:0;border-radius:13px;padding:13px 20px;background:var(--t);color:#fff;font:inherit;font-weight:850}.status{font-size:14px;color:var(--u)}.done{padding:34px;text-align:center}.hidden{display:none!important}.req{color:#d04f3e}@media(max-width:560px){.wrap{padding:15px 12px 45px}.hero{padding:24px 19px}.q{padding:16px 13px}.ans,.help{margin-left:0}.actions{flex-direction:column;align-items:stretch}}</style></head><body><main class="wrap"><div class="brand"><b><span class="logo">B</span>BME Tesztek – SzD</b><span style="font-size:13px;color:#647773">tanköri kérdőív</span></div><section id="loading" class="notice">Kérdőív betöltése…</section><div id="app" class="hidden"><section class="hero"><div class="eyebrow">BME Építőmérnöki Kar · Tankör</div><h1 id="title"></h1><p id="description"></p><div class="meta"><span class="pill">kb. 5–7 perc</span><span class="pill">nincs jó vagy rossz válasz</span></div></section><section class="notice">A válaszokat a tanköri közösség megismeréséhez és a tanköri alkalmak jobb összeállításához használjuk.</section><div class="progress"><div class="track"><span id="bar"></span></div></div><form id="form"><div id="questions"></div><div class="actions"><button id="submit" class="btn">Válaszok elküldése</button><span id="status" class="status"></span></div></form></div><section id="done" class="done hidden"><h2>Köszönöm! ✓</h2><p>A válaszaidat elmentettük.</p></section></main><script>const slug=location.pathname.split('/').filter(Boolean).pop(),$=s=>document.querySelector(s);let survey;const hidden=new Set(['Hegy vagy tenger?','Reggeli ember vagy éjszakai bagoly?','Papír vagy digitális jegyzet?','Android vagy iPhone?']);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function qh(q,i){let a='';if(q.type==='text')a=`<input type=text name="${q.id}">`;if(q.type==='textarea')a=`<textarea name="${q.id}"></textarea>`;if(q.type==='single')a=(q.options||[]).map(o=>`<label class=choice><input type=radio name="${q.id}" value="${esc(o)}">${esc(o)}</label>`).join('');if(q.type==='multi')a=(q.options||[]).map(o=>`<label class=choice><input type=checkbox name="${q.id}" value="${esc(o)}">${esc(o)}</label>`).join('');if(q.type==='scale')a=`<div class=scale>${[1,2,3,4,5].map(v=>`<label><input type=radio name="${q.id}" value="${v}">${v}</label>`).join('')}</div><div class=labels><span>${esc(q.minLabel||'egyáltalán nem')}</span><span>${esc(q.maxLabel||'teljesen')}</span></div>`;return `<section class=q data-q="${q.id}"><div class=head><div class=num>${i+1}</div><div class=label>${esc(q.label)}${q.required?'<span class=req> *</span>':''}</div></div>${q.help?`<div class=help>${esc(q.help)}</div>`:''}<div class=ans>${a}</div></section>`}function prog(){const f=new FormData($('#form'));let n=0;for(const q of survey.questions){if(q.type==='multi'?f.getAll(q.id).length:String(f.get(q.id)||'').trim())n++}$('#bar').style.width=`${Math.round(100*n/survey.questions.length)}%`}async function load(){try{const r=await fetch(`/api/surveys/${slug}`),j=await r.json();survey=j.survey;survey.questions=(survey.questions||[]).filter(q=>!hidden.has(String(q.label||'').trim()));$('#title').textContent=survey.title;$('#description').textContent=survey.description||'';let h='',s='';survey.questions.forEach((q,i)=>{if(q.section&&q.section!==s){s=q.section;h+=`<div class=section>${esc(s)}</div>`}h+=qh(q,i)});$('#questions').innerHTML=h;$('#loading').classList.add('hidden');$('#app').classList.remove('hidden');$('#form').oninput=prog}catch(e){$('#loading').textContent='A kérdőív nem érhető el.'}}$('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),answers={};for(const q of survey.questions){answers[q.id]=q.type==='multi'?f.getAll(q.id):String(f.get(q.id)||'').trim();if(q.required&&!answers[q.id]?.length){$('#status').textContent='Töltsd ki a csillaggal jelölt kérdéseket.';return}}const b=$('#submit');b.disabled=true;$('#status').textContent='Mentés…';const r=await fetch(`/api/surveys/${slug}/responses`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});if(r.ok){$('#app').classList.add('hidden');$('#done').classList.remove('hidden')}else{b.disabled=false;$('#status').textContent='Nem sikerült elküldeni.'}};load();</script></body></html>
