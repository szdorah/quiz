<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kérdőív eredmények</title><link rel="stylesheet" href="/styles.css"><style>.survey-results{max-width:1200px}.survey-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.survey-stat{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:#e4f5ef;color:#0f766e;font-weight:800}.scroll{overflow:auto;border:1px solid #d8e8e3;border-radius:14px;margin-top:18px}.results-table{width:100%;border-collapse:collapse;min-width:900px}.results-table th,.results-table td{padding:10px 12px;border-bottom:1px solid #e8efed;text-align:left;vertical-align:top;font-size:13px}.results-table th{position:sticky;top:0;background:#f3faf7;color:#285b53;z-index:1}.answer-cell{max-width:280px;white-space:normal}.small-muted{color:#6b7b77;font-size:13px}</style></head><body><main class="shell"><section class="card survey-results"><div class="survey-top"><div><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><h1 id="title" class="page-title">Kérdőív eredmények</h1><p id="desc" class="small-muted"></p></div><div class="actions"><a class="btn" href="/admin/dashboard">Vissza</a><a id="xlsx" class="btn primary" href="#">Excel letöltése</a></div></div><p><span id="count" class="survey-stat">0 kitöltés</span></p><div id="status" class="small-muted">Betöltés…</div><div id="tableWrap" class="scroll hidden"><table class="results-table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section></main><script>const slug=location.pathname.split('/').filter(Boolean).pop(),$=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const [sr,rr]=await Promise.all([fetch(`/api/admin/surveys/${slug}`),fetch(`/api/admin/surveys/${slug}/responses`)]);const s=await sr.json(),r=await rr.json();if(!sr.ok||!s.ok)throw new Error(s.error||'Kérdőív nem található.');if(!rr.ok||!r.ok)throw new Error(r.error||'Válaszok nem tölthetők be.');const survey=s.survey,responses=r.responses||[];$('#title').textContent=survey.title;$('#desc').textContent=survey.description||'';$('#count').textContent=`${responses.length} kitöltés`;$('#xlsx').href=`/api/admin/surveys/${slug}/xlsx`;const qs=survey.questions||[];$('#thead').innerHTML='<tr><th>#</th><th>Beküldve</th>'+qs.map((q,i)=>`<th>${i+1}. ${esc(q.label)}</th>`).join('')+'</tr>';$('#tbody').innerHTML=responses.map((x,i)=>`<tr><td>${i+1}</td><td>${new Date(x.submitted_at).toLocaleString('hu-HU')}</td>${qs.map(q=>{const v=x.answers?.[q.id];return `<td class="answer-cell">${esc(Array.isArray(v)?v.join(', '):v||'')}</td>`}).join('')}</tr>`).join('');$('#status').classList.add('hidden');$('#tableWrap').classList.remove('hidden')}catch(e){$('#status').textContent=e.message}}load();</script></body></html>
