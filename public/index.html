<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="hero">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <h1>Gyors, élő kvízek előadásokhoz.</h1>
        <p>Letisztult, mobilbarát rendszer QR-kódos belépéssel, valós idejű játékkal és letölthető eredményekkel.</p>
        <div class="actions">
          <a class="btn primary" href="/play">Hallgatói belépés</a>
          <a class="btn" href="/admin">Oktatói felület</a>
        </div>
      </div>
      <div class="panel">
        <div class="grid">
          <div class="stat"><strong>100–150 fő</strong><span class="small">Tervezett egyidejű használat</span></div>
          <div class="stat"><strong>QR + kód</strong><span class="small">Gyors hallgatói csatlakozás</span></div>
          <div class="stat"><strong>CSV / Excel</strong><span class="small">Letölthető eredmények</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
