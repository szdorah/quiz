<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kvíz – SZAGRI Quiz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card game-card">
      <div class="topbar">
        <div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div>
        <span id="timer" class="badge">30 mp</span>
      </div>
      <div id="questionView">
        <div id="questionMeta" class="small" style="margin-top:24px"></div>
        <div id="questionImageWrap" class="question-image-wrap hidden"><img id="questionImage" alt="Kérdés képe" /></div>
        <h1 id="prompt" class="game-question">Kérdés betöltése…</h1>
        <div id="typeHint" class="question-type-hint hidden"></div>
        <div id="answers" class="game-answers"></div>
        <div id="submitWrap" class="actions hidden"><button id="submitAnswer" class="btn primary" type="button">Válasz beküldése</button></div>
        <p id="status" class="small"></p>
      </div>
      <div id="resultView" class="hidden center-card">
        <div id="resultIcon" class="waiting-avatar">✓</div>
        <h2 id="resultTitle">Válasz elküldve</h2>
        <p id="resultText"></p>
        <div class="waiting-pill">Várakozás a következő kérdésre…</div>
      </div>
      <div id="leaderboardView" class="hidden">
        <div class="center-card">
          <div class="waiting-avatar">🏆</div>
          <h1 class="page-title">Végeredmény</h1>
          <p>Szép munka!</p>
        </div>
        <div id="leaderboard" class="quiz-list"></div>
      </div>
    </section>
  </main>
<script src="/socket.io/socket.io.js"></script>
<script>
  const playerRaw = sessionStorage.getItem('szagri_player');
  const sessionRaw = sessionStorage.getItem('szagri_session');
  const questionRaw = sessionStorage.getItem('szagri_question');
  if (!playerRaw || !sessionRaw || !questionRaw) location.href = '/play';

  const player = JSON.parse(playerRaw);
  const session = JSON.parse(sessionRaw);
  const socket = io();
  let currentQuestion = null;
  let selectedIndexes = [];
  let submitted = false;
  let timerHandle = null;

  socket.on('connect', () => socket.emit('session:join', session.id));
  socket.on('game:question', q => {
    sessionStorage.setItem('szagri_question', JSON.stringify(q));
    showQuestion(q);
  });
  socket.on('game:finished', board => showLeaderboard(board));

  function isMulti(q) { return String(q?.questionType || '').toLowerCase() === 'multi_select'; }
  function isTrueFalse(q) { return String(q?.questionType || '').toLowerCase() === 'true_false'; }

  function showQuestion(q) {
    currentQuestion = q;
    selectedIndexes = [];
    submitted = false;
    document.getElementById('questionView').classList.remove('hidden');
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('leaderboardView').classList.add('hidden');
    document.getElementById('submitWrap').classList.add('hidden');
    document.getElementById('prompt').textContent = q.prompt || 'Kérdés';
    document.getElementById('questionMeta').textContent = q.questionNumber && q.questionTotal ? `${q.questionNumber}. / ${q.questionTotal}. kérdés` : '';
    document.getElementById('status').textContent = isMulti(q) ? 'Több válasz is helyes lehet.' : 'Válassz egy választ.';

    const hint = document.getElementById('typeHint');
    if (isMulti(q)) {
      hint.textContent = '☑ Több helyes válasz – jelöld be mindet';
      hint.classList.remove('hidden');
    } else if (isTrueFalse(q)) {
      hint.textContent = 'Igaz / hamis';
      hint.classList.remove('hidden');
    } else hint.classList.add('hidden');

    const imageWrap = document.getElementById('questionImageWrap');
    if (q.imageUrl) {
      document.getElementById('questionImage').src = q.imageUrl;
      imageWrap.classList.remove('hidden');
    } else imageWrap.classList.add('hidden');

    const answers = document.getElementById('answers');
    answers.innerHTML = '';
    (q.options || []).forEach((option, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'answer-choice';
      const text = typeof option === 'string' ? option : (option.text || '');
      const badge = isTrueFalse(q) ? (index === 0 ? '✓' : '×') : String.fromCharCode(65 + index);
      button.innerHTML = `<span>${badge}</span><strong></strong>`;
      button.querySelector('strong').textContent = text;
      button.onclick = () => selectAnswer(index, button);
      answers.appendChild(button);
    });
    startTimer(Number(q.settings?.timeLimitSeconds || 30));
  }

  function selectAnswer(index, button) {
    if (submitted) return;
    if (isMulti(currentQuestion)) {
      if (selectedIndexes.includes(index)) {
        selectedIndexes = selectedIndexes.filter(i => i !== index);
        button.classList.remove('selected');
      } else {
        selectedIndexes.push(index);
        button.classList.add('selected');
      }
    } else {
      selectedIndexes = [index];
      document.querySelectorAll('.answer-choice').forEach(x => x.classList.remove('selected'));
      button.classList.add('selected');
    }
    document.getElementById('submitWrap').classList.toggle('hidden', selectedIndexes.length === 0);
  }

  document.getElementById('submitAnswer').onclick = submitAnswer;

  async function submitAnswer() {
    if (submitted || !selectedIndexes.length) return;
    submitted = true;
    clearInterval(timerHandle);
    document.querySelectorAll('.answer-choice').forEach(x => x.disabled = true);
    document.getElementById('submitAnswer').disabled = true;
    document.getElementById('status').textContent = 'Beküldés…';
    const res = await fetch('/api/answers', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        playerId: player.id,
        sessionId: session.id,
        questionId: currentQuestion.id,
        selectedIndexes
      })
    });
    const data = await res.json();
    if (!res.ok) {
      submitted = false;
      document.querySelectorAll('.answer-choice').forEach(x => x.disabled = false);
      document.getElementById('submitAnswer').disabled = false;
      document.getElementById('status').textContent = data.error || 'Nem sikerült beküldeni.';
      return;
    }
    const r = data.result;
    player.score = Number(r.total_score || player.score || 0);
    sessionStorage.setItem('szagri_player', JSON.stringify(player));
    document.getElementById('questionView').classList.add('hidden');
    document.getElementById('resultView').classList.remove('hidden');
    document.getElementById('resultIcon').textContent = r.is_correct ? '✓' : '×';
    document.getElementById('resultTitle').textContent = r.is_correct ? 'Helyes válasz!' : 'Válasz elküldve';
    document.getElementById('resultText').textContent = r.is_correct ? `+${r.points_awarded} pont · Összesen ${r.total_score} pont` : `Most 0 pont · Összesen ${r.total_score} pont`;
  }

  function startTimer(seconds) {
    clearInterval(timerHandle);
    let left = seconds;
    const timer = document.getElementById('timer');
    timer.textContent = `${left} mp`;
    timerHandle = setInterval(() => {
      left -= 1;
      timer.textContent = `${Math.max(left,0)} mp`;
      if (left <= 0) {
        clearInterval(timerHandle);
        if (!submitted) {
          document.querySelectorAll('.answer-choice').forEach(x => x.disabled = true);
          document.getElementById('submitWrap').classList.add('hidden');
          document.getElementById('status').textContent = 'Lejárt az idő. Várakozás a következő kérdésre…';
        }
      }
    }, 1000);
  }

  function showLeaderboard(board) {
    clearInterval(timerHandle);
    document.getElementById('questionView').classList.add('hidden');
    document.getElementById('resultView').classList.add('hidden');
    document.getElementById('leaderboardView').classList.remove('hidden');
    const medals = ['🥇','🥈','🥉'];
    document.getElementById('leaderboard').innerHTML = (board || []).map((p,i) => `
      <article class="quiz-row">
        <div><strong>${medals[i] || (i+1)+'.'} ${escapeHtml(p.emoji)} ${escapeHtml(p.name)}</strong></div>
        <strong>${p.score} pont</strong>
      </article>`).join('');
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }

  showQuestion(JSON.parse(questionRaw));
</script>
</body>
</html>
