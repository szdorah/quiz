<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz – SZAGRI Quiz</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="card game-card"><div class="topbar"><div class="brand"><div class="logo">Q</div><span>SZAGRI Quiz</span></div><span id="timer" class="badge">30 mp</span></div><div id="questionView"><div id="questionMeta" class="small" style="margin-top:20px"></div><div id="questionImageWrap" class="question-image-wrap hidden"><img id="questionImage"></div><h1 id="prompt" class="game-question">Kérdés betöltése…</h1><div id="typeHint" class="question-type-hint hidden"></div><div id="answers" class="game-answers"></div><div id="submitWrap" class="actions hidden"><button id="submitAnswer" class="btn primary">Válasz beküldése</button></div><p id="status" class="small"></p></div><div id="resultView" class="hidden center-card"><div id="resultIcon" class="waiting-avatar">✓</div><h2 id="resultTitle"></h2><p id="resultText"></p><div id="explanation" class="explanation-box hidden"></div><div class="waiting-pill">Várakozás a következő kérdésre…</div></div><div id="leaderboardView" class="hidden"><div class="center-card"><div class="waiting-avatar">🏆</div><h1 class="page-title">Végeredmény</h1></div><div id="leaderboard" class="quiz-list"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const playerRaw=sessionStorage.getItem('szagri_player'),sessionRaw=sessionStorage.getItem('szagri_session'),questionRaw=sessionStorage.getItem('szagri_question');if(!playerRaw||!sessionRaw||!questionRaw)location.href='/play';const player=JSON.parse(playerRaw),session=JSON.parse(sessionRaw),socket=io();let q=null,selected=[],assignments=[],point=null,submitted=false,timerHandle=null,selectedCat=null;
const $=s=>document.querySelector(s),type=()=>String(q?.questionType||'').toLowerCase(),multi=()=>type()==='multi_select',ordering=()=>type()==='ordering',category=()=>type()==='categorization',imageClick=()=>type()==='image_click',tf=()=>type()==='true_false';
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
socket.on('connect',()=>socket.emit('session:join',session.id));socket.on('game:question',x=>{sessionStorage.setItem('szagri_question',JSON.stringify(x));show(x)});socket.on('game:finished',board=>showBoard(board));
function show(x){q=x;selected=[];assignments=Array((q.options||[]).length).fill(-1);point=null;selectedCat=null;submitted=false;$('#questionView').classList.remove('hidden');$('#resultView').classList.add('hidden');$('#leaderboardView').classList.add('hidden');$('#submitWrap').classList.add('hidden');$('#submitAnswer').disabled=false;$('#answers').classList.remove('answer-locked');$('#prompt').textContent=q.prompt||'Kérdés';$('#questionMeta').textContent=q.questionNumber&&q.questionTotal?`${q.questionNumber}. / ${q.questionTotal}. kérdés`:'';const hint=$('#typeHint');hint.textContent=multi()?'☑ Több helyes válasz – részpont is jár':ordering()?'↕ Állítsd helyes sorrendbe':category()?'↔ Rendezd kategóriákba':imageClick()?'🎯 Koppints a helyes területre':tf()?'Igaz / hamis':'';hint.classList.toggle('hidden',!hint.textContent);const iw=$('#questionImageWrap');if(q.imageUrl&&!imageClick()){$('#questionImage').src=q.imageUrl;iw.classList.remove('hidden')}else iw.classList.add('hidden');const a=$('#answers');a.innerHTML='';if(ordering())renderOrder(a);else if(category())renderCategory(a);else if(imageClick())renderImage(a);else renderChoices(a);startTimer(Number(q.settings?.timeLimitSeconds||30));}
function renderChoices(a){a.className='game-answers';shuffle((q.options||[]).map((o,i)=>({o,i}))).forEach(({o,i},pos)=>{const b=document.createElement('button');b.className='answer-choice';b.type='button';b.dataset.index=i;const text=typeof o==='string'?o:o.text||'';b.innerHTML=`<span>${tf()?(text.toLowerCase().includes('hamis')?'×':'✓'):String.fromCharCode(65+pos)}</span><strong></strong>`;b.querySelector('strong').textContent=text;b.onclick=()=>choose(i,b);a.appendChild(b)});$('#status').textContent=multi()?'Több válasz is helyes lehet.':'Válassz egy választ.'}
function choose(i,b){if(submitted)return;if(multi()){if(selected.includes(i)){selected=selected.filter(x=>x!==i);b.classList.remove('selected')}else{selected.push(i);b.classList.add('selected')}}else{selected=[i];document.querySelectorAll('.answer-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}$('#submitWrap').classList.toggle('hidden',!selected.length)}
function renderOrder(a){a.className='ordering-list';shuffle((q.options||[]).map((o,i)=>({o,i}))).forEach(({o,i})=>{const r=document.createElement('div');r.className='ordering-item sortable-item';r.dataset.index=i;r.innerHTML='<span class="drag-handle">☰</span><span class="ordering-position"></span><strong></strong><div class="order-controls"><button class="mini-btn up">↑</button><button class="mini-btn down">↓</button></div>';r.querySelector('strong').textContent=typeof o==='string'?o:o.text||'';r.querySelector('.up').onclick=()=>move(r,-1);r.querySelector('.down').onclick=()=>move(r,1);a.appendChild(r)});renumber(a);bindSort(a);$('#submitWrap').classList.remove('hidden');$('#status').textContent='Húzd az elemeket, vagy használd a nyilakat.'}
function move(r,d){if(submitted)return;const a=[...r.parentElement.children],i=a.indexOf(r),j=i+d;if(j<0||j>=a.length)return;if(d<0)r.parentElement.insertBefore(r,a[j]);else r.parentElement.insertBefore(a[j],r);renumber(r.parentElement)}function renumber(a){[...a.children].forEach((x,i)=>x.querySelector('.ordering-position').textContent=i+1)}
function bindSort(a){let drag=null,pid=null;a.onpointerdown=e=>{const h=e.target.closest('.drag-handle');if(!h||submitted)return;drag=h.closest('.ordering-item');pid=e.pointerId;h.setPointerCapture?.(pid);drag.classList.add('dragging');e.preventDefault()};a.onpointermove=e=>{if(!drag||e.pointerId!==pid)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.ordering-item');if(!t||t===drag||t.parentElement!==a)return;const r=t.getBoundingClientRect();a.insertBefore(drag,e.clientY<r.top+r.height/2?t:t.nextSibling);renumber(a)};a.onpointerup=a.onpointercancel=()=>{drag?.classList.remove('dragging');drag=null;pid=null}}
function renderCategory(a){a.className='category-game';const cats=q.settings?.categories||[];const pool=document.createElement('div');pool.className='category-pool';pool.innerHTML='<strong>Elemek</strong><div class="category-pool-items"></div>';a.appendChild(pool);const cols=document.createElement('div');cols.className='category-columns';a.appendChild(cols);cats.forEach((name,ci)=>{const z=document.createElement('div');z.className='category-zone';z.dataset.category=ci;z.innerHTML='<strong></strong><div class="category-zone-items"></div>';z.querySelector('strong').textContent=name;z.onclick=e=>{if(e.target.closest('.category-item')||!selectedCat)return;assign(selectedCat,ci)};z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();const i=+e.dataTransfer.getData('text/plain');const item=a.querySelector(`.category-item[data-index="${i}"]`);if(item)assign(item,ci)};cols.appendChild(z)});shuffle((q.options||[]).map((o,i)=>({o,i}))).forEach(({o,i})=>{const b=document.createElement('button');b.className='category-item';b.type='button';b.draggable=true;b.dataset.index=i;b.textContent=typeof o==='string'?o:o.text||'';b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.category-item').forEach(x=>x.classList.remove('selected'));selectedCat=selectedCat===b?null:b;if(selectedCat)b.classList.add('selected')};b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));pool.querySelector('.category-pool-items').appendChild(b)});$('#status').textContent='Húzd a kategóriába; mobilon koppints az elemre, majd a kategóriára.'}
function assign(item,ci){item.classList.remove('selected');a=$('#answers');a.querySelector(`.category-zone[data-category="${ci}"] .category-zone-items`).appendChild(item);assignments[+item.dataset.index]=ci;selectedCat=null;$('#submitWrap').classList.toggle('hidden',assignments.some(x=>x<0))}
function renderImage(a){a.className='image-click-stage';const w=document.createElement('div');w.className='click-image-wrap';w.innerHTML='<img class="click-image"><span class="student-click-marker hidden"></span>';w.querySelector('img').src=q.imageUrl||'';w.onclick=e=>{if(submitted)return;const img=w.querySelector('img'),r=img.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x<0||x>1||y<0||y>1)return;point={x:+x.toFixed(4),y:+y.toFixed(4)};const m=w.querySelector('span');m.style.left=`${x*100}%`;m.style.top=`${y*100}%`;m.classList.remove('hidden');$('#submitWrap').classList.remove('hidden')};a.appendChild(w);$('#status').textContent='Koppints a képen a megfelelő területre.'}
$('#submitAnswer').onclick=submit;async function submit(){if(submitted)return;let answer;if(ordering())answer={orderedIndexes:[...document.querySelectorAll('.ordering-item')].map(x=>+x.dataset.index)};else if(category()){if(assignments.some(x=>x<0))return;answer={assignments}};if(imageClick()){if(!point)return;answer={point}};if(!ordering()&&!category()&&!imageClick()){if(!selected.length)return;answer={selectedIndexes:selected}}submitted=true;clearInterval(timerHandle);lock();const r=await fetch('/api/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:player.id,sessionId:session.id,questionId:q.id,answer})}),d=await r.json();if(!r.ok){submitted=false;unlock();$('#status').textContent=d.error||'Hiba';return}const x=d.result,partial=!x.is_correct&&Number(x.points_awarded)>0;player.score=Number(x.total_score||0);sessionStorage.setItem('szagri_player',JSON.stringify(player));$('#questionView').classList.add('hidden');$('#resultView').classList.remove('hidden');$('#resultIcon').textContent=x.is_correct?'✓':partial?'½':'×';$('#resultTitle').textContent=x.is_correct?'Helyes válasz!':partial?'Részben helyes':'Válasz elküldve';$('#resultText').textContent=`+${x.points_awarded} pont · Összesen ${x.total_score} pont`;$('#explanation').textContent=x.explanation||'';$('#explanation').classList.toggle('hidden',!x.explanation)}
function lock(){document.querySelectorAll('button').forEach(x=>{if(x.closest('#questionView'))x.disabled=true});$('#answers').classList.add('answer-locked')}function unlock(){document.querySelectorAll('#questionView button').forEach(x=>x.disabled=false);$('#answers').classList.remove('answer-locked');$('#submitAnswer').disabled=false}
function startTimer(sec){clearInterval(timerHandle);let left=sec;$('#timer').textContent=`${left} mp`;timerHandle=setInterval(()=>{left--;$('#timer').textContent=`${Math.max(left,0)} mp`;if(left<=0){clearInterval(timerHandle);if(!submitted){submitted=true;lock();$('#submitWrap').classList.add('hidden');$('#status').textContent='Lejárt az idő. Várakozás…'}}},1000)}
function showBoard(board){clearInterval(timerHandle);$('#questionView').classList.add('hidden');$('#resultView').classList.add('hidden');$('#leaderboardView').classList.remove('hidden');const medals=['🥇','🥈','🥉'];$('#leaderboard').innerHTML=(board||[]).map((p,i)=>`<article class="quiz-row"><strong>${medals[i]||(i+1)+'.'} ${p.emoji} ${p.name}</strong><strong>${p.score} pont</strong></article>`).join('')}
show(JSON.parse(questionRaw));
</script></body></html>
